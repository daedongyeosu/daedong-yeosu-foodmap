name: Apply selective DB790 integration

on:
  push:
    branches: [agent/main-unification]
    paths:
      - '.integration/apply-db790'
  pull_request:
    branches: [main]
    paths:
      - '.integration/apply-db790'

permissions:
  contents: write

concurrency:
  group: apply-db790-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0

      - name: Guard branch and marker
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test "$branch" = "agent/main-unification"
          test -f .integration/apply-db790
          echo "Integration branch confirmed; main will not be modified."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch legacy DB790 source
        shell: bash
        run: |
          git fetch origin fix/load-stores-db790 --depth=1
          rm -rf /tmp/db790-worktree
          git worktree add --detach /tmp/db790-worktree FETCH_HEAD

      - name: Prepare selective import
        shell: bash
        run: |
          rm -rf build/db790-import
          mkdir -p build/db790-import
          node scripts/prepare-db790-import.mjs /tmp/db790-worktree build/db790-import | tee build/db790-import-prepare.txt
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('build/db790-import/report.json','utf8'));
          if(report.mergedCount!==471) throw new Error(`Expected 471 stores, got ${report.mergedCount}`);
          if(report.addedCount!==40) throw new Error(`Expected 40 additions, got ${report.addedCount}`);
          if(report.excluded.length!==2) throw new Error(`Expected 2 management-page exclusions, got ${report.excluded.length}`);
          if(report.copyFileCount<500) throw new Error(`Unexpectedly small safe photo set: ${report.copyFileCount}`);
          console.log('Selective import gates passed',report);
          NODE

      - name: Back up current integrated database
        shell: bash
        run: cp data/stores.json data/stores.before-db790-integration.json

      - name: Copy safe referenced photos only
        shell: bash
        run: |
          copied=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            source="/tmp/db790-worktree/$file"
            test -f "$source"
            mkdir -p "$(dirname "$file")"
            cp "$source" "$file"
            copied=$((copied+1))
          done < build/db790-import/copy-files.txt
          echo "Copied safe photo files: $copied"
          test "$copied" -ge 500

      - name: Install selected stores and audit reports
        shell: bash
        run: |
          cp build/db790-import/stores.json data/stores.json
          cp build/db790-import/report.json data/db790-import-report.json
          mkdir -p data/integration-sources/db790
          for file in \
            notion-sync-summary.json \
            notion-sync-report.json \
            notion-complete-import-report.json \
            notion-import-missing-report.json \
            store-dedup-report.json \
            photo-filter-report.json \
            photo-match-safety-report.json \
            photo-manifest.json \
            notion-photo-manifest.json \
            notion-photo-apply-report.json \
            photo-coverage-resolution.json; do
            if [[ -f "/tmp/db790-worktree/data/$file" ]]; then
              cp "/tmp/db790-worktree/data/$file" "data/integration-sources/db790/$file"
            fi
          done
          node scripts/update-photo-manifest-after-db790.mjs

      - name: Validate applied branch state
        shell: bash
        run: |
          node --check app.js
          node scripts/validate-integration.mjs
          node scripts/test-app-unit.mjs
          node - <<'NODE'
          const fs=require('fs');
          const stores=JSON.parse(fs.readFileSync('data/stores.json','utf8'));
          const ids=new Set(stores.map(s=>String(s.id)));
          const names=new Set(stores.map(s=>String(s.name).trim().toLowerCase().replace(/[\s·&()\-_/.,]/g,'')));
          if(stores.length!==471||ids.size!==471||names.size!==471) throw new Error('Final database count or uniqueness check failed');
          const management=stores.filter(s=>/^대동여수음식지도(?:\s|\(|$)/.test(String(s.name||'').trim()));
          if(management.length) throw new Error(`Management pages remain: ${management.map(s=>s.name).join(', ')}`);
          let broken=0;
          for(const store of stores){
            const image=String(store.image||'').trim();
            if(image&&!/^https?:\/\//i.test(image)&&!fs.existsSync(image)) broken++;
            for(const route of store.routes||[]){
              if(!/^(https?:\/\/|tel:)/i.test(String(route.url||''))) throw new Error(`Invalid route URL: ${store.name} / ${route.name}`);
            }
          }
          if(broken) throw new Error(`Broken local photo paths: ${broken}`);
          console.log('Applied database validated: 471 unique stores, no management pages, no broken local photo paths.');
          NODE

      - name: Commit branch-only integration
        shell: bash
        run: |
          git config user.name "daedong-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stores.json data/stores.before-db790-integration.json data/db790-import-report.json data/photo-manifest.json data/integration-sources/db790
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            git add "$file"
          done < build/db790-import/copy-files.txt
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "DB790 검증 데이터와 안전 사진 선별 통합"
          git push origin HEAD:agent/main-unification
