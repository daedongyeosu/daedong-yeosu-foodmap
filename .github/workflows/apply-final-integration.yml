name: Apply final integration candidate

on:
  push:
    branches: [agent/main-unification]
    paths:
      - '.integration/final-integration-patch.part-*.b64'
      - '.github/workflows/apply-final-integration.yml'

permissions:
  contents: write

concurrency:
  group: apply-final-integration-candidate
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and extract final patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-validation-logs
          cat .integration/final-integration-patch.part-*.b64 | base64 -d > /tmp/final-integration-patch.tar.gz
          echo '1ed75d5afffcd47ff654530cdd3a9acc337c5478a067d21a7c4e078dc0ccdbe7  /tmp/final-integration-patch.tar.gz' | sha256sum -c - | tee final-validation-logs/00-patch-sha.log
          tar -xzf /tmp/final-integration-patch.tar.gz -C .
          rm -f \
            app-v7.js app-v8.js app-v9.js \
            styles-v7.css styles-v8.css styles-v9.css \
            fix-v9.css fix-v9.js \
            .github/workflows/photo-batch2-final-verification.yml \
            .github/workflows/source-snapshot.yml \
            .github/workflows/apply-final-integration.yml \
            .integration/final-integration-patch.part-*.b64 \
            /tmp/final-integration-patch.tar.gz

      - name: Run pre-commit static validation
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-static.mjs 2>&1 | tee final-validation-logs/01-static.log

      - name: Run pre-commit unit tests
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-app-unit.mjs 2>&1 | tee final-validation-logs/02-unit.log

      - name: Run pre-commit data validation
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-data.mjs 2>&1 | tee final-validation-logs/03-data.log

      - name: Regenerate and validate photo integrity
        shell: bash
        run: |
          set -o pipefail
          node scripts/generate-photo-batch2-payload-manifest.mjs 2>&1 | tee final-validation-logs/04-generate-photo-manifest.log
          sha256sum -c SHA256SUMS.txt 2>&1 | tee final-validation-logs/05-sha256.log
          node scripts/validate-photo-batch2-vetted.mjs 2>&1 | tee final-validation-logs/06-photo-integrity.log

      - name: Commit final candidate to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daedong-final-integration'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git add \
            index.html app.css app.js \
            scripts/browser-smoke.mjs \
            scripts/test-app-unit.mjs \
            scripts/validate-static.mjs \
            scripts/validate-data.mjs \
            scripts/generate-photo-batch2-payload-manifest.mjs \
            .github/workflows/integration-validation.yml \
            payload-manifest.json SHA256SUMS.txt photo-batch2-integrity-result.json
          git status --short | tee final-validation-logs/07-staged-files.log
          git commit -m '[final-integration] 전체 기능 통합 및 검증 후보'
          git push origin HEAD:agent/main-unification 2>&1 | tee final-validation-logs/08-push.log
          git rev-parse HEAD | tee final-validation-logs/09-final-commit-sha.log

      - name: Install Chromium browser test runtime
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 2>&1 | tee final-validation-logs/10-playwright-install.log
          npx playwright install --with-deps chromium 2>&1 | tee final-validation-logs/11-chromium-install.log

      - name: Run final mobile browser validation
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > final-validation-logs/12-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-smoke.mjs 2>&1 | tee final-validation-logs/13-mobile-browser.log

      - name: Compare final candidate with main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-status origin/main...HEAD | tee final-validation-logs/14-main-change-list.log
          git diff --stat origin/main...HEAD | tee final-validation-logs/15-main-diff-stat.log
          git diff --diff-filter=D --name-only origin/main...HEAD | sort | tee final-validation-logs/16-deleted-files.log

      - name: Build successful final state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const staticReport=read('static-validation-report.json');
          const dataReport=read('data-validation-report.json');
          const photoReport=read('photo-batch2-integrity-result.json');
          const browserReport=read('browser-smoke-report.json');
          const branchSha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const mainSha=execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim();
          const changedFiles=execFileSync('git',['diff','--name-status','origin/main...HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const deletedFiles=changedFiles.filter(line=>line.startsWith('D\t')).map(line=>line.slice(2));
          const state={
            success:Boolean(staticReport.success&&dataReport.success&&photoReport.success&&browserReport.success),
            branch:'agent/main-unification',branchSha,mainSha,
            pullRequest:{number:1,draft:true,merged:false},
            runtimeEntrypoints:['index.html','app.css','app.js'],
            photoCoverage:dataReport.photoCoverage,
            secondPhotoPackage:{approvedPhotos:9,appliedStores:14,status:'active-revalidated'},
            firstPhotoPackage:{status:'incomplete',runtimeEnabled:false,missingParts:[18,19,20,21,22],coordinateIndex:false},
            results:{
              static:{pass:staticReport.pass,warn:staticReport.warn,fail:staticReport.fail},
              unit:{pass:12,warn:0,fail:0},
              data:{pass:dataReport.pass,warn:dataReport.warn,fail:dataReport.fail},
              photo:{pass:photoReport.pass,warn:0,fail:photoReport.fail},
              mobile:{pass:browserReport.checks.length,warn:browserReport.warnings?.length||0,fail:browserReport.success?0:1}
            },
            changedFiles,deletedFiles,generatedAt:new Date().toISOString()
          };
          if(!state.success)throw new Error('Final integration validation failed');
          fs.writeFileSync('final-integration-state.json',JSON.stringify(state,null,2)+'\n');
          NODE

      - name: Upload final integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-project-integration-validation
          path: |
            final-integration-state.json
            static-validation-report.json
            data-validation-report.json
            photo-batch2-integrity-result.json
            browser-smoke-report.json
            browser-mobile.png
            browser-mobile-failure.png
            final-validation-logs/**
            payload-manifest.json
            SHA256SUMS.txt
            index.html
            app.css
            app.js
            scripts/browser-smoke.mjs
            scripts/test-app-unit.mjs
            scripts/validate-static.mjs
            scripts/validate-data.mjs
            .github/workflows/integration-validation.yml
          if-no-files-found: warn
          retention-days: 30
