name: Apply runtime validation fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0

      - name: Guard branch
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "agent/main-unification"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact runtime fixes
        run: node scripts/apply-runtime-fixes.mjs

      - name: Validate patched files
        shell: bash
        run: |
          node --check app.js
          node --check scripts/browser-smoke.mjs
          ! grep -q -- '-m.webp' app.js
          grep -q "hasAttribute('hidden')" scripts/browser-smoke.mjs

      - name: Commit integration-branch fixes
        shell: bash
        run: |
          git config user.name "daedong-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js scripts/browser-smoke.mjs
          if git diff --cached --quiet; then
            echo "No runtime fixes to commit"
            exit 0
          fi
          git commit -m "모바일 배너 경로와 브라우저 검수 조건 수정"
          git push origin HEAD:agent/main-unification
