name: Apply store photos

on:
  push:
    branches:
      - fix/load-stores-db790
    paths:
      - 'assets/store-photos/**'
      - 'data/photo-manifest.json'
      - 'tools/filter-menu-photos.py'
      - 'tools/filter-food-only-v2.py'
      - 'tools/apply-photo-manifest-smart.mjs'
      - 'tools/photo-match-safety.mjs'
      - '.github/workflows/apply-store-photos.yml'
  workflow_dispatch:
    inputs:
      restore_original_photos:
        description: '과도한 필터링 전 원본 사진 묶음에서 다시 복구'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: apply-store-photos
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/load-stores-db790
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python photo filter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image filter dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate photo data
        run: |
          test -f data/photo-manifest.json || { echo "data/photo-manifest.json이 없습니다."; exit 1; }
          test -d assets/store-photos || { echo "assets/store-photos 폴더가 없습니다."; exit 1; }
          git cat-file -e 0bdd7d6a2e12a685c247323cc2f47aba4f0751f3:data/photo-manifest.json

      - name: Restore safe food photos and smart-match stores
        env:
          APPLY_CHANGES: 'true'
          PHOTO_SOURCE_COMMIT: 0bdd7d6a2e12a685c247323cc2f47aba4f0751f3
          RESTORE_SOURCE: ${{ github.event_name == 'push' || inputs.restore_original_photos == true }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daedong-photo-sync"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "음식사진 스마트 재매칭 시도 ${attempt}/5"
            git fetch origin fix/load-stores-db790
            git reset --hard origin/fix/load-stores-db790

            if [ "$RESTORE_SOURCE" = "true" ]; then
              echo "과도한 필터링 전 원본 사진 묶음을 작업공간에 복원합니다."
              git checkout "$PHOTO_SOURCE_COMMIT" -- assets/store-photos data/photo-manifest.json
            fi

            PHOTO_SAFETY_PHASE=pre node tools/photo-match-safety.mjs
            python tools/filter-food-only-v2.py
            node tools/apply-photo-manifest-smart.mjs
            PHOTO_SAFETY_PHASE=post node tools/photo-match-safety.mjs

            git add -A assets/store-photos data/photo-manifest.json data/stores.json data/photo-apply-report.json data/photo-filter-report.json data/photo-match-safety-report.json data/photo-match-review.json data/stores.before-photo-apply.json

            if git diff --cached --quiet; then
              echo "사진 데이터 변경 없음"
              exit 0
            fi

            git commit -m "안전 음식사진 복구와 스마트 가게 재매칭"
            git fetch origin fix/load-stores-db790
            if git rebase origin/fix/load-stores-db790 && git push origin HEAD:fix/load-stores-db790; then
              echo "스마트 사진 재매칭 반영 완료"
              exit 0
            fi

            echo "다른 작업과 충돌하여 최신 데이터로 다시 계산합니다."
            git rebase --abort 2>/dev/null || true
            sleep 6
          done

          echo "다섯 번 재시도했지만 사진 데이터를 저장하지 못했습니다."
          exit 1
