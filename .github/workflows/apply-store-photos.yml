name: Apply store photos

on:
  push:
    branches:
      - fix/load-stores-db790
    paths:
      - 'assets/store-photos/**'
      - 'data/photo-manifest.json'
      - 'tools/filter-menu-photos.py'
      - 'tools/apply-photo-manifest.mjs'
      - 'tools/photo-match-safety.mjs'
      - '.github/workflows/apply-store-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-store-photos
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/load-stores-db790
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python photo filter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image filter dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate photo package
        run: |
          test -f data/photo-manifest.json || { echo "data/photo-manifest.json이 없습니다."; exit 1; }
          test -d assets/store-photos || { echo "assets/store-photos 폴더가 없습니다."; exit 1; }

      - name: Remove sensitive files, rematch safely and push
        env:
          APPLY_CHANGES: 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daedong-photo-sync"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "민감사진 제거와 안전매칭 시도 ${attempt}/3"
            git fetch origin fix/load-stores-db790
            git reset --hard origin/fix/load-stores-db790

            PHOTO_SAFETY_PHASE=pre node tools/photo-match-safety.mjs
            python tools/filter-menu-photos.py
            node tools/apply-photo-manifest.mjs
            PHOTO_SAFETY_PHASE=post node tools/photo-match-safety.mjs

            git add -A assets/store-photos data/photo-manifest.json data/stores.json data/photo-apply-report.json data/photo-filter-report.json data/photo-match-safety-report.json data/stores.before-photo-apply.json

            if git diff --cached --quiet; then
              echo "사진 데이터 변경 없음"
              exit 0
            fi

            git commit -m "민감서류 완전 격리와 음식사진 안전 재매칭"
            if git push origin HEAD:fix/load-stores-db790; then
              echo "민감사진 제거와 안전 사진매칭 반영 완료"
              exit 0
            fi

            echo "다른 작업이 먼저 저장되어 최신 데이터로 다시 계산합니다."
            sleep 5
          done

          echo "세 번 재시도했지만 사진 데이터를 저장하지 못했습니다."
          exit 1
