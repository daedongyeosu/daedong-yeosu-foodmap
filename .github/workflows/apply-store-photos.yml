name: Apply store photos

on:
  push:
    branches:
      - fix/load-stores-db790
    paths:
      - 'assets/store-photos/**'
      - 'data/photo-manifest.json'
      - '.github/workflows/apply-store-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-store-photos
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/load-stores-db790
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate photo package
        run: |
          test -f data/photo-manifest.json || { echo "data/photo-manifest.json이 없습니다."; exit 1; }
          test -d assets/store-photos || { echo "assets/store-photos 폴더가 없습니다."; exit 1; }

      - name: Match photos to stores and distribute franchise pools
        env:
          APPLY_CHANGES: 'true'
        run: node tools/apply-photo-manifest.mjs

      - name: Commit applied photo data
        run: |
          git config user.name "daedong-photo-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/stores.json data/photo-apply-report.json data/stores.before-photo-apply.json
          if git diff --cached --quiet; then
            echo "No photo data changes"
            exit 0
          fi
          git commit -m "가게사진 자동매칭과 프랜차이즈 사진 다양화"
          git push origin HEAD:fix/load-stores-db790
