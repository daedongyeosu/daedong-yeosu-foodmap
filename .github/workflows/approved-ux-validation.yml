name: Approved UX remote branch validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - '*.mjs'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/approved-ux-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-ux-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Prove revision and record provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch origin "$EXPECTED_BASE_REF" --no-tags
          git diff --name-only "origin/$EXPECTED_BASE_REF...HEAD" | sort > github-actions-changed-files.txt
          git log -1 --format='%H%n%P%n%an%n%ae%n%aI%n%s' > github-actions-head-commit.txt

      - name: Checkout current main for before screenshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: before-main
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run static, unit, data and photo checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-static.mjs
          node scripts/test-app-unit.mjs
          node scripts/validate-data.mjs
          sha256sum -c SHA256SUMS.txt
          node scripts/validate-photo-batch2-vetted.mjs

      - name: Install mobile browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Compare mobile flow with current main
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory before-main > before-main-server.log 2>&1 &
          before_pid=$!
          python3 -m http.server 4174 --bind 127.0.0.1 > after-branch-server.log 2>&1 &
          after_pid=$!
          trap 'kill $before_pid $after_pid 2>/dev/null || true' EXIT
          sleep 3
          BEFORE_URL=http://127.0.0.1:4173 AFTER_URL=http://127.0.0.1:4174 node scripts/approved-ux-mobile.mjs

      - name: Bind evidence to this run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          : > github-actions-evidence-sha256.txt
          for file in approved-ux-*.html approved-ux-comparison.json static-validation-report.json data-validation-report.json photo-batch2-integrity-result.json; do
            if [ -f "$file" ]; then sha256sum "$file" >> github-actions-evidence-sha256.txt; fi
          done

      - name: Upload mobile validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-ux-github-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            github-actions-changed-files.txt
            github-actions-head-commit.txt
            github-actions-evidence-sha256.txt
            approved-ux-comparison.json
            approved-ux-before-main.html
            approved-ux-after-home.html
            static-validation-report.json
            data-validation-report.json
            photo-batch2-integrity-result.json
            before-main-server.log
            after-branch-server.log
          if-no-files-found: warn
          retention-days: 30
