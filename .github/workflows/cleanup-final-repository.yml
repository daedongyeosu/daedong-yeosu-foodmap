name: Clean generated files and validate final candidate

on:
  push:
    branches: [agent/main-unification]
    paths:
      - '.github/workflows/cleanup-final-repository.yml'

permissions:
  contents: write

concurrency:
  group: clean-final-repository
  cancel-in-progress: false

jobs:
  clean-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove generated dependencies and obsolete helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules final-proof-logs
          rm -f \
            browser-mobile.png \
            browser-mobile-failure.png \
            browser-smoke-report.json \
            static-validation-report.json \
            data-validation-report.json \
            final-integration-state.json \
            scripts/apply-runtime-fixes.mjs \
            scripts/fix-banner-runtime.mjs \
            .github/workflows/cleanup-final-repository.yml
          cat > .gitignore <<'EOF'
          node_modules/
          final-proof-logs/
          browser-mobile.png
          browser-mobile-failure.png
          browser-smoke-report.json
          static-validation-report.json
          data-validation-report.json
          final-integration-state.json
          npm-debug.log*
          EOF

      - name: Refresh tracked photo integrity manifests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/final-clean-proof/logs
          node scripts/generate-photo-batch2-payload-manifest.mjs 2>&1 | tee /tmp/final-clean-proof/logs/00-generate-photo-manifest.log

      - name: Run pre-commit non-browser validation
        shell: bash
        run: |
          set -o pipefail
          node --check app.js 2>&1 | tee /tmp/final-clean-proof/logs/01-app-syntax.log
          node scripts/validate-static.mjs 2>&1 | tee /tmp/final-clean-proof/logs/02-static-precommit.log
          node scripts/test-app-unit.mjs 2>&1 | tee /tmp/final-clean-proof/logs/03-unit-precommit.log
          node scripts/validate-data.mjs 2>&1 | tee /tmp/final-clean-proof/logs/04-data-precommit.log
          sha256sum -c SHA256SUMS.txt 2>&1 | tee /tmp/final-clean-proof/logs/05-sha-precommit.log
          node scripts/validate-photo-batch2-vetted.mjs 2>&1 | tee /tmp/final-clean-proof/logs/06-photo-precommit.log

      - name: Create clean candidate commit locally
        id: clean_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daedong-final-cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short | tee /tmp/final-clean-proof/logs/07-clean-staged-files.log
          test -z "$(git ls-files 'node_modules/**')"
          git commit -m '[final-cleanup] 검증 생성물·node_modules 제거 및 정식 기준 정리'
          clean_sha=$(git rev-parse HEAD)
          echo "sha=$clean_sha" >> "$GITHUB_OUTPUT"
          echo "$clean_sha" | tee /tmp/final-clean-proof/logs/08-clean-candidate-sha.log

      - name: Install isolated Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-playwright
          mkdir -p /tmp/final-playwright
          npm init -y --prefix /tmp/final-playwright >/dev/null
          npm install --prefix /tmp/final-playwright --no-package-lock playwright@1.55.0 2>&1 | tee /tmp/final-clean-proof/logs/09-playwright-install.log
          /tmp/final-playwright/node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee /tmp/final-clean-proof/logs/10-chromium-install.log
          ln -s /tmp/final-playwright/node_modules node_modules

      - name: Validate exact clean candidate commit
        shell: bash
        run: |
          set -o pipefail
          node --check app.js 2>&1 | tee /tmp/final-clean-proof/logs/11-app-syntax-final.log
          node scripts/validate-static.mjs 2>&1 | tee /tmp/final-clean-proof/logs/12-static-final.log
          node scripts/test-app-unit.mjs 2>&1 | tee /tmp/final-clean-proof/logs/13-unit-final.log
          node scripts/validate-data.mjs 2>&1 | tee /tmp/final-clean-proof/logs/14-data-final.log
          sha256sum -c SHA256SUMS.txt 2>&1 | tee /tmp/final-clean-proof/logs/15-sha-final.log
          node scripts/validate-photo-batch2-vetted.mjs 2>&1 | tee /tmp/final-clean-proof/logs/16-photo-final.log
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/final-clean-proof/logs/17-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true; rm -f node_modules' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-smoke.mjs 2>&1 | tee /tmp/final-clean-proof/logs/18-mobile-final.log
          kill $server_pid 2>/dev/null || true
          rm -f node_modules
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Build exact clean proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-status origin/main...HEAD | tee /tmp/final-clean-proof/main-change-list.txt
          git diff --stat origin/main...HEAD | tee /tmp/final-clean-proof/main-diff-stat.txt
          git diff --diff-filter=D --name-only origin/main...HEAD | sort | tee /tmp/final-clean-proof/deleted-files.txt
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const s=read('static-validation-report.json');
          const d=read('data-validation-report.json');
          const p=read('photo-batch2-integrity-result.json');
          const b=read('browser-smoke-report.json');
          const state={
            success:Boolean(s.success&&d.success&&p.success&&b.success),
            branch:'agent/main-unification',
            finalCandidateSha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
            mainSha:execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim(),
            pullRequest:{number:1,draft:true,merged:false},
            runtimeEntrypoints:['index.html','app.css','app.js'],
            photoCoverage:d.photoCoverage,
            firstPhotoPackage:{status:'incomplete',runtimeEnabled:false,missingParts:[18,19,20,21,22],coordinateIndex:false},
            secondPhotoPackage:{status:'active-revalidated',approvedPhotos:9,appliedStores:14},
            results:{
              static:{pass:s.pass,warn:s.warn,fail:s.fail},
              unit:{pass:12,warn:0,fail:0},
              data:{pass:d.pass,warn:d.warn,fail:d.fail},
              photo:{pass:p.pass,warn:0,fail:p.fail},
              mobile:{pass:b.checks.length,warn:b.warnings?.length||0,fail:b.success?0:1}
            },
            cleanRepository:{nodeModulesTracked:false,generatedLogsTracked:false,temporaryWorkflowsTracked:false},
            generatedAt:new Date().toISOString()
          };
          if(!state.success)throw new Error('Clean final candidate validation failed');
          fs.writeFileSync('/tmp/final-clean-proof/final-clean-state.json',JSON.stringify(state,null,2)+'\n');
          NODE
          cp static-validation-report.json /tmp/final-clean-proof/
          cp data-validation-report.json /tmp/final-clean-proof/
          cp photo-batch2-integrity-result.json /tmp/final-clean-proof/
          cp browser-smoke-report.json /tmp/final-clean-proof/
          cp browser-mobile.png /tmp/final-clean-proof/ 2>/dev/null || true
          cp payload-manifest.json SHA256SUMS.txt /tmp/final-clean-proof/

      - name: Push exact validated clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/main-unification 2>&1 | tee /tmp/final-clean-proof/logs/19-push.log
          remote_sha=$(git ls-remote origin refs/heads/agent/main-unification | cut -f1)
          test "$remote_sha" = "$(git rev-parse HEAD)"
          echo "$remote_sha" | tee /tmp/final-clean-proof/remote-head-sha.txt

      - name: Upload clean final proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-final-project-integration-proof
          path: /tmp/final-clean-proof/**
          if-no-files-found: error
          retention-days: 30
