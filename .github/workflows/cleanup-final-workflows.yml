name: Clean obsolete integration workflows

on:
  push:
    branches: [agent/main-unification]
    paths:
      - '.github/workflows/cleanup-final-workflows.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0
          show-progress: false

      - name: Remove obsolete write workflows and refresh state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          rm -f \
            .github/workflows/apply-db790-integration.yml \
            .github/workflows/apply-runtime-fixes.yml \
            .github/workflows/restore-banner-assets.yml \
            .github/workflows/cleanup-final-workflows.yml
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const state=JSON.parse(fs.readFileSync('final-integration-state.json','utf8'));
          const changedFiles=execFileSync('git',['diff','--name-status','origin/main'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).filter(line=>!line.endsWith('.github/workflows/cleanup-final-workflows.yml'));
          state.changedFiles=changedFiles;
          state.deletedFiles=changedFiles.filter(line=>line.startsWith('D\t')).map(line=>line.slice(2));
          state.obsoleteWriteWorkflowsRemoved=['.github/workflows/apply-db790-integration.yml','.github/workflows/apply-runtime-fixes.yml','.github/workflows/restore-banner-assets.yml'];
          state.finalTreeCleanupAt=new Date().toISOString();
          fs.writeFileSync('final-integration-state.json',JSON.stringify(state,null,2)+'\n');
          NODE

      - name: Commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daedong-final-cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m '[final-cleanup] 정식 기준용 일회성 쓰기 워크플로 제거'
          git push origin HEAD:agent/main-unification
          git rev-parse HEAD
