name: Temporary Ddangyo Gateway Probe

on:
  push:
    branches:
      - work/ddangyo-fingerprint-batch-01
    paths:
      - scripts/ddangyo-shop-data-probe.mjs
      - .github/workflows/ddangyo-gateway-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/ddangyo-shop-data-probe.mjs
      - .github/workflows/ddangyo-gateway-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Fetch Ddangyo shop details and full menus
        run: node scripts/ddangyo-shop-data-probe.mjs

      - name: Upload shop data results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddangyo-shop-data
          path: ddangyo-shop-data-output
          if-no-files-found: error
          retention-days: 1
