name: Temporary Ddangyo Gateway Probe

on:
  push:
    branches:
      - work/ddangyo-fingerprint-batch-01
    paths:
      - scripts/ddangyo-shorturl-direct-probe.mjs
      - .github/workflows/ddangyo-gateway-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/ddangyo-shorturl-direct-probe.mjs
      - .github/workflows/ddangyo-gateway-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Resolve Ddangyo short URLs through the original API
        run: node scripts/ddangyo-shorturl-direct-probe.mjs

      - name: Upload short URL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddangyo-shorturl-probe
          path: ddangyo-shorturl-output
          if-no-files-found: error
          retention-days: 1
