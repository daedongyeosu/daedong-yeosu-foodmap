name: Temporary Ddangyo Gateway Probe

on:
  push:
    branches:
      - work/ddangyo-fingerprint-batch-01
    paths:
      - scripts/ddangyo-shop-api-discovery.mjs
      - .github/workflows/ddangyo-gateway-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/ddangyo-shop-api-discovery.mjs
      - .github/workflows/ddangyo-gateway-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Discover Ddangyo shop detail submissions
        run: node scripts/ddangyo-shop-api-discovery.mjs

      - name: Upload shop discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddangyo-shop-discovery
          path: ddangyo-shop-discovery-output
          if-no-files-found: error
          retention-days: 1
