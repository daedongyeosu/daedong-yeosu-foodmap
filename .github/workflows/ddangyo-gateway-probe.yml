name: Temporary Ddangyo Gateway Probe

on:
  push:
    branches:
      - work/ddangyo-fingerprint-batch-01
    paths:
      - scripts/ddangyo-gateway-probe.mjs
      - scripts/ddangyo-browser-probe.py
      - .github/workflows/ddangyo-gateway-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/ddangyo-gateway-probe.mjs
      - scripts/ddangyo-browser-probe.py
      - .github/workflows/ddangyo-gateway-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install browser probe dependency
        run: python -m pip install --disable-pip-version-check selenium

      - name: Run Ddangyo in headless Chrome and capture network responses
        run: python scripts/ddangyo-browser-probe.py

      - name: Upload browser probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddangyo-browser-probe
          path: ddangyo-browser-output
          if-no-files-found: error
          retention-days: 1
