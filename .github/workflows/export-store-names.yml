name: Export store names

on:
  push:
    branches:
      - fix/load-stores-db790
    paths:
      - 'tools/export-store-names.mjs'
      - '.github/workflows/export-store-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/load-stores-db790
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/export-store-names.mjs
      - run: |
          git config user.name "daedong-store-export"
          git config user.email "actions@users.noreply.github.com"
          git add data/store-names.json data/store-names.base64.txt data/store-name-chunks
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "사진 매칭용 가게명 목록 갱신"
          git push
