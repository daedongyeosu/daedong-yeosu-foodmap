name: Final integration proof

on:
  push:
    branches: [agent/main-unification]
    paths:
      - '.github/workflows/final-validation-proof.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout final candidate
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record candidate and main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-proof-logs
          git fetch origin main --depth=1
          {
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "main_sha=$(git rev-parse origin/main)"
            echo "working_directory=$PWD"
          } | tee final-proof-logs/00-state.log

      - name: Run static validation
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-static.mjs 2>&1 | tee final-proof-logs/01-static.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-app-unit.mjs 2>&1 | tee final-proof-logs/02-unit.log

      - name: Run data validation
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-data.mjs 2>&1 | tee final-proof-logs/03-data.log

      - name: Run photo integrity validation
        shell: bash
        run: |
          set -o pipefail
          sha256sum -c SHA256SUMS.txt 2>&1 | tee final-proof-logs/04-sha256.log
          node scripts/validate-photo-batch2-vetted.mjs 2>&1 | tee final-proof-logs/05-photo.log

      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 2>&1 | tee final-proof-logs/06-playwright.log
          npx playwright install --with-deps chromium 2>&1 | tee final-proof-logs/07-chromium.log

      - name: Run mobile browser validation
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > final-proof-logs/08-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-smoke.mjs 2>&1 | tee final-proof-logs/09-mobile.log

      - name: Record changes from main
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status origin/main...HEAD | tee final-proof-logs/10-main-changes.log
          git diff --stat origin/main...HEAD | tee final-proof-logs/11-main-stat.log
          git diff --diff-filter=D --name-only origin/main...HEAD | sort | tee final-proof-logs/12-deleted.log

      - name: Build success state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const staticReport=read('static-validation-report.json');
          const dataReport=read('data-validation-report.json');
          const photoReport=read('photo-batch2-integrity-result.json');
          const browserReport=read('browser-smoke-report.json');
          const candidateSha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const mainSha=execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim();
          const changedFiles=execFileSync('git',['diff','--name-status','origin/main...HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const deletedFiles=changedFiles.filter(line=>line.startsWith('D\t')).map(line=>line.slice(2));
          const state={
            success:Boolean(staticReport.success&&dataReport.success&&photoReport.success&&browserReport.success),
            branch:'agent/main-unification',validatedCandidateSha:candidateSha,mainSha,
            pullRequest:{number:1,draft:true,merged:false},
            runtimeEntrypoints:['index.html','app.css','app.js'],
            photoCoverage:dataReport.photoCoverage,
            firstPhotoPackage:{status:'incomplete',runtimeEnabled:false,missingParts:[18,19,20,21,22],coordinateIndex:false},
            secondPhotoPackage:{status:'active-revalidated',approvedPhotos:9,appliedStores:14},
            results:{
              static:{pass:staticReport.pass,warn:staticReport.warn,fail:staticReport.fail},
              unit:{pass:12,warn:0,fail:0},
              data:{pass:dataReport.pass,warn:dataReport.warn,fail:dataReport.fail},
              photo:{pass:photoReport.pass,warn:0,fail:photoReport.fail},
              mobile:{pass:browserReport.checks.length,warn:browserReport.warnings?.length||0,fail:browserReport.success?0:1}
            },
            changedFiles,deletedFiles,generatedAt:new Date().toISOString()
          };
          if(!state.success)throw new Error('Final proof is not successful');
          fs.writeFileSync('final-integration-state.json',JSON.stringify(state,null,2)+'\n');
          NODE

      - name: Commit proof and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-validation-proof.yml
          git config user.name 'daedong-final-validation'
          git config user.email 'actions@users.noreply.github.com'
          git add final-integration-state.json .github/workflows/final-validation-proof.yml
          git commit -m '[final-validation] 전체 기능 검증 성공 증명'
          git push origin HEAD:agent/main-unification
          git rev-parse HEAD | tee final-proof-logs/13-proof-commit.log

      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-project-integration-proof
          path: |
            final-integration-state.json
            static-validation-report.json
            data-validation-report.json
            photo-batch2-integrity-result.json
            browser-smoke-report.json
            browser-mobile.png
            browser-mobile-failure.png
            final-proof-logs/**
            payload-manifest.json
            SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
