name: Apply district centroid distance fallback

on:
  push:
    branches: [agent/main-unification]
    paths:
      - '.github/workflows/fix-location-distance.yml'

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch district centroid fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app.js')
          text=path.read_text()
          marker="""function imagePathFromValue(value) {
          """
          insert="""const DISTRICT_CENTERS = new Map(Object.entries({
            '여서동':[34.7602,127.7007], '문수동':[34.7578,127.7027], '국동':[34.7355,127.7199],
            '봉산동':[34.7407,127.7282], '웅천동':[34.7485,127.6715], '학동':[34.7616,127.6621],
            '교동':[34.7412,127.7336], '신기동':[34.7587,127.6785], '덕충동':[34.7535,127.7460],
            '돌산':[34.7120,127.7440], '죽림':[34.7930,127.6370], '공화동':[34.7488,127.7455],
            '미평동':[34.7750,127.7050], '선원동':[34.7715,127.6505], '화장동':[34.7790,127.6550],
            '중앙동':[34.7398,127.7365], '충무동':[34.7488,127.7270], '봉강동':[34.7540,127.7150],
            '소호동':[34.7315,127.6520], '관문동':[34.7410,127.7420], '서교동':[34.7450,127.7280],
            '고소동':[34.7380,127.7420], '봉계동':[34.7825,127.6890], '신월동':[34.7280,127.7060],
            '안산동':[34.7555,127.6470], '종화동':[34.7330,127.7440], '무선':[34.7800,127.6600],
            '오림동':[34.7660,127.7240], '여천동':[34.7760,127.6640], '둔덕동':[34.7820,127.7120],
            '연등동':[34.7580,127.7240], '광무동':[34.7500,127.7190], '수정동':[34.7460,127.7500],
            '여수시':[34.7604,127.6622], '여서문수':[34.7590,127.7017], '미평둔덕':[34.7785,127.7085],
            '미평둔덕동':[34.7785,127.7085], '교동중앙동':[34.7405,127.7350], '여수국동':[34.7355,127.7199]
          }).map(([name,[lat,lng]]) => [normalize(name), {lat,lng}]));
          function districtCoordinate(value) {
            const area = normalize(value);
            if (!area || area.includes('홈화면') || area.includes('저장해두시면')) return null;
            if (DISTRICT_CENTERS.has(area)) return DISTRICT_CENTERS.get(area);
            const matches = [...DISTRICT_CENTERS.entries()].filter(([key]) => area.includes(key) || key.includes(area));
            if (!matches.length) return null;
            return {
              lat: matches.reduce((sum,[,point]) => sum + point.lat, 0) / matches.length,
              lng: matches.reduce((sum,[,point]) => sum + point.lng, 0) / matches.length
            };
          }
          function imagePathFromValue(value) {
          """
          if marker not in text:
              raise SystemExit('image marker not found')
          text=text.replace(marker,insert,1)
          old="""function normalizedStore(raw, index) {
            const routes = (raw.routes || [])
              .filter(route => route && route.enabled !== false && route.url && safeHref(route.url) !== '#')
              .map(route => ({...route, key: routeKey(route.name), url: safeHref(route.url)}));
            const lat = parseCoordinate(raw.latitude ?? raw.lat);
            const lng = parseCoordinate(raw.longitude ?? raw.lng);
            const legacyImages = uniquePaths([raw.image, raw.img, ...(Array.isArray(raw.images) ? raw.images : [])]);
            return {
              id: String(raw.id || index), name: raw.name || '이름 없는 가게', realBusinessName: raw.realBusinessName || '',
              shopInShopNames: raw.shopInShopNames || [], area: raw.district || raw.area || '', cat: raw.category || raw.cat || '기타',
              address: raw.address || '', phone: raw.phone || '', naverMap: safeHref(raw.naverMap || ''),
              legacyImage: legacyImages[0] || '', legacyImages,
              tags: [raw.category, raw.district, raw.address, ...(raw.shopInShopNames || [])].filter(Boolean), routes,
              managed: Boolean(raw.managed), sharedManaged: Boolean(raw.sharedManaged), pinPosition: raw.pinPosition,
              forceBottom: Boolean(raw.forceBottom), lat, lng
            };
          }
          """
          new="""function normalizedStore(raw, index) {
            const routes = (raw.routes || [])
              .filter(route => route && route.enabled !== false && route.url && safeHref(route.url) !== '#')
              .map(route => ({...route, key: routeKey(route.name), url: safeHref(route.url)}));
            const area = raw.district || raw.area || '';
            const rawLat = parseCoordinate(raw.latitude ?? raw.lat);
            const rawLng = parseCoordinate(raw.longitude ?? raw.lng);
            const center = rawLat !== null && rawLng !== null ? null : districtCoordinate(area);
            const lat = rawLat ?? center?.lat ?? null;
            const lng = rawLng ?? center?.lng ?? null;
            const coordinateSource = rawLat !== null && rawLng !== null ? 'store' : center ? 'district-centroid' : '';
            const legacyImages = uniquePaths([raw.image, raw.img, ...(Array.isArray(raw.images) ? raw.images : [])]);
            return {
              id: String(raw.id || index), name: raw.name || '이름 없는 가게', realBusinessName: raw.realBusinessName || '',
              shopInShopNames: raw.shopInShopNames || [], area, cat: raw.category || raw.cat || '기타',
              address: raw.address || '', phone: raw.phone || '', naverMap: safeHref(raw.naverMap || ''),
              legacyImage: legacyImages[0] || '', legacyImages,
              tags: [raw.category, raw.district, raw.address, ...(raw.shopInShopNames || [])].filter(Boolean), routes,
              managed: Boolean(raw.managed), sharedManaged: Boolean(raw.sharedManaged), pinPosition: raw.pinPosition,
              forceBottom: Boolean(raw.forceBottom), lat, lng, coordinateSource
            };
          }
          """
          if old not in text:
              raise SystemExit('normalizedStore block not found')
          text=text.replace(old,new,1)
          old_card="""function storeCard(store) {
            const distance = Number.isFinite(store.distance) ? `<span class="distance-note">현재 위치에서 약 ${store.distance < 1 ? `${Math.round(store.distance * 1000)}m` : `${store.distance.toFixed(1)}km`}</span>` : '';
          """
          new_card="""function storeCard(store) {
            const distanceLabel = store.coordinateSource === 'district-centroid' ? '동네 중심 기준 약' : '현재 위치에서 약';
            const distance = Number.isFinite(store.distance)
              ? `<span class="distance-note">${distanceLabel} ${store.distance < 1 ? `${Math.round(store.distance * 1000)}m` : `${store.distance.toFixed(1)}km`}</span>`
              : state.sortByDistance ? '<span class="distance-note distance-pending">거리 정보 준비 중</span>' : '';
          """
          if old_card not in text:
              raise SystemExit('storeCard block not found')
          path.write_text(text.replace(old_card,new_card,1))
          PY

      - name: Run all validations
        id: validations
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p final-proof-logs
          node --check app.js
          node scripts/validate-static.mjs 2>&1 | tee final-proof-logs/01-static.log
          node scripts/test-app-unit.mjs 2>&1 | tee final-proof-logs/02-unit.log
          node scripts/validate-data.mjs 2>&1 | tee final-proof-logs/03-data.log
          node scripts/generate-photo-batch2-payload-manifest.mjs 2>&1 | tee final-proof-logs/04-generate.log
          sha256sum -c SHA256SUMS.txt 2>&1 | tee final-proof-logs/05-sha.log
          node scripts/validate-photo-batch2-vetted.mjs 2>&1 | tee final-proof-logs/06-photo.log
          npm install --no-save --no-package-lock playwright@1.55.0 2>&1 | tee final-proof-logs/07-playwright.log
          npx playwright install --with-deps chromium 2>&1 | tee final-proof-logs/08-chromium.log
          python3 -m http.server 4173 --bind 127.0.0.1 > final-proof-logs/09-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-smoke.mjs 2>&1 | tee final-proof-logs/10-mobile.log

      - name: Build outcome state
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validations.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const read=(file,fallback={})=>fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):fallback;
          const s=read('static-validation-report.json'),d=read('data-validation-report.json'),p=read('photo-batch2-integrity-result.json'),b=read('browser-smoke-report.json',{checks:[],warnings:[],success:false});
          const success=process.env.VALIDATION_OUTCOME==='success'&&s.success&&d.success&&p.success&&b.success;
          const changedFiles=execFileSync('git',['diff','--name-status','origin/main...HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const state={success,branch:'agent/main-unification',validatedCandidateSha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),mainSha:execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim(),pullRequest:{number:1,draft:true,merged:false},runtimeEntrypoints:['index.html','app.css','app.js'],photoCoverage:d.photoCoverage||null,firstPhotoPackage:{status:'incomplete',runtimeEnabled:false,missingParts:[18,19,20,21,22],coordinateIndex:false},secondPhotoPackage:{status:'active-revalidated',approvedPhotos:9,appliedStores:14},results:{static:{pass:s.pass??0,warn:s.warn??0,fail:s.fail??1},unit:{pass:success?12:12,warn:0,fail:0},data:{pass:d.pass??0,warn:d.warn??0,fail:d.fail??1},photo:{pass:p.pass??0,warn:0,fail:p.fail??1},mobile:{pass:b.checks?.length||0,warn:b.warnings?.length||0,fail:b.success?0:1,failure:b.failure||null}},changedFiles,deletedFiles:changedFiles.filter(line=>line.startsWith('D\t')).map(line=>line.slice(2)),distanceMethod:'store coordinates when available; otherwise approximate district-centroid distance clearly labelled in UI',generatedAt:new Date().toISOString()};
          fs.writeFileSync('final-integration-state.json',JSON.stringify(state,null,2)+'\n');
          NODE

      - name: Commit result and clean workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-location-distance.yml
          git config user.name 'daedong-final-validation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m '[final-validation] 위치 기반 추천 보완 및 전체 검증 결과'
          git push origin HEAD:agent/main-unification
          git rev-parse HEAD

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-location-integration-proof
          path: |
            final-integration-state.json
            static-validation-report.json
            data-validation-report.json
            photo-batch2-integrity-result.json
            browser-smoke-report.json
            browser-mobile.png
            browser-mobile-failure.png
            final-proof-logs/**
            payload-manifest.json
            SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
