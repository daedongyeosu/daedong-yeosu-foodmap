name: Runtime source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/full-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout final integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0
          show-progress: false

      - name: Build exact runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          out=/tmp/runtime-snapshot
          rm -rf "$out"
          mkdir -p "$out"

          for file in \
            index.html app.css app.js \
            payload-manifest.json SHA256SUMS.txt photo-batch2-integrity-result.json \
            static-validation-report.json data-validation-report.json \
            scripts/browser-smoke.mjs scripts/test-app-unit.mjs \
            scripts/validate-static.mjs scripts/validate-data.mjs \
            scripts/validate-photo-batch2-vetted.mjs \
            scripts/generate-photo-batch2-payload-manifest.mjs \
            .github/workflows/integration-validation.yml; do
            if [[ -f "$file" ]]; then
              mkdir -p "$out/$(dirname "$file")"
              cp "$file" "$out/$file"
            fi
          done
          cp -a data "$out/data"

          node --input-type=module "$out" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const out=process.argv[2];
          const refs=new Set();
          const add=value=>{
            if(typeof value==='string'&&/^(?:images|assets)\/.+\.(?:png|jpe?g|webp|gif|avif)$/i.test(value.split(/[?#]/)[0]))refs.add(value.split(/[?#]/)[0]);
            else if(Array.isArray(value))value.forEach(add);
            else if(value&&typeof value==='object')Object.values(value).forEach(add);
          };
          for(const file of ['index.html','app.css','app.js']){
            const text=fs.readFileSync(file,'utf8');
            for(const match of text.matchAll(/(?:images|assets)\/[A-Za-z0-9_./()\-]+\.(?:png|jpe?g|webp|gif|avif)/gi))refs.add(match[0]);
          }
          for(let n=1;n<=17;n++)refs.add(`images/${String(n).padStart(2,'0')}.png`);
          add(JSON.parse(fs.readFileSync('data/stores.json','utf8')));
          add(JSON.parse(fs.readFileSync('data/photo-manifest.json','utf8')));
          const missing=[];
          for(const rel of [...refs].sort()){
            if(!fs.existsSync(rel)){missing.push(rel);continue;}
            const target=path.join(out,rel);
            fs.mkdirSync(path.dirname(target),{recursive:true});
            fs.copyFileSync(rel,target);
          }
          fs.writeFileSync(path.join(out,'RUNTIME_REFERENCES.txt'),[...refs].sort().join('\n')+'\n');
          fs.writeFileSync(path.join(out,'MISSING_RUNTIME_REFERENCES.txt'),missing.join('\n')+(missing.length?'\n':''));
          if(missing.length)throw new Error(`Missing runtime references: ${missing.length}`);
          NODE

          git rev-parse HEAD > "$out/BRANCH_HEAD.txt"
          git rev-parse origin/main > "$out/MAIN_HEAD.txt"
          git status --short > "$out/WORKTREE_STATUS.txt"
          find "$out" -type f -printf '%P\n' | sort > "$out/SNAPSHOT_FILES.txt"
          du -sh "$out" | tee "$out/SNAPSHOT_SIZE.txt"

      - name: Upload runtime source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: final-runtime-source-snapshot
          path: /tmp/runtime-snapshot/**
          if-no-files-found: error
          retention-days: 7
