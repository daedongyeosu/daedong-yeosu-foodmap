name: Import nine Notion stores

on:
  push:
    branches:
      - agent/sync-nine-new-stores
    paths:
      - 'scripts/nine-notion-store-config.mjs'
      - 'scripts/import-nine-notion-stores.mjs'
      - 'scripts/validate-nine-notion-stores.mjs'
      - '.github/workflows/import-nine-notion-stores.yml'

permissions:
  contents: write

concurrency:
  group: import-nine-notion-stores
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-nine-new-stores
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Import exactly nine stores and three photos each
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/import-nine-notion-stores.mjs

      - name: Create generated candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daedong-notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/stores.json data/photo-manifest.json SHA256SUMS.txt assets/notion-store-photos
          git diff --cached --check
          test "$(git diff --cached --name-only -- assets/notion-store-photos | wc -l)" -eq 27
          git commit -m "노션 신규 가게 9곳과 사진 27장 동기화"

      - name: Verify legacy data and new galleries
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          EXPECTED_BASE_REF=main node scripts/validate-nine-notion-stores.mjs
          node scripts/validate-static.mjs
          node scripts/test-app-unit.mjs
          node scripts/validate-data.mjs
          sha256sum -c SHA256SUMS.txt
          node scripts/validate-photo-batch2-vetted.mjs

      - name: Push verified generated commit
        run: git push origin HEAD:agent/sync-nine-new-stores
