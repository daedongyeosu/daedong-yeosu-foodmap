name: Integration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'data/**'
      - 'images/notion-stores/**'
      - 'scripts/**'
      - '.github/workflows/integration-validation.yml'
  push:
    branches: [agent/main-unification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Inventory data sources
        shell: bash
        run: node scripts/inventory-data-sources.mjs 2>&1 | tee data-inventory.txt

      - name: Compare DB790 working branch
        id: db790
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git fetch origin fix/load-stores-db790 --depth=1
          DB790_REF=FETCH_HEAD
          git show "$DB790_REF:data/stores.json" > /tmp/stores-db790.json
          {
            echo '[DB790 branch markers]'
            git show "$DB790_REF:DB790_READY.txt" 2>/dev/null || true
            git show "$DB790_REF:README_DB790_TEST.txt" 2>/dev/null || true
            echo
            echo '[DB790 related files]'
            git ls-tree -r --name-only "$DB790_REF" | grep -Ei '(^data/|photo|db790|notion|route|address)' | sort
          } > db790-branch-inventory.txt
          node scripts/compare-store-databases.mjs data/stores.json /tmp/stores-db790.json db790-comparison.json 2>&1 | tee db790-comparison.txt

      - name: Inventory photo packages
        shell: bash
        run: node scripts/inventory-photo-packages.mjs 2>&1 | tee photo-inventory.txt

      - name: Inspect photo package encoding
        shell: bash
        run: node scripts/inspect-photo-parts.mjs 2>&1 | tee photo-parts-inspection.txt

      - name: Test safe photo assembly
        id: photo_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/build-photo-batch-1.mjs 2>&1 | tee photo-build.txt

      - name: Run integration validation
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-integration.mjs 2>&1 | tee integration-validation.txt

      - name: Run unit regression tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-app-unit.mjs 2>&1 | tee unit-tests.txt

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-validation-report
          path: |
            data-inventory.txt
            db790-branch-inventory.txt
            db790-comparison.txt
            db790-comparison.json
            photo-inventory.txt
            photo-parts-inspection.txt
            photo-build.txt
            integration-validation.txt
            unit-tests.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Final validation gate
        if: always()
        shell: bash
        run: |
          echo "db790=${{ steps.db790.outcome }}"
          echo "photo_build=${{ steps.photo_build.outcome }}"
          echo "integration=${{ steps.integration.outcome }}"
          echo "unit=${{ steps.unit.outcome }}"
          if [[ "${{ steps.integration.outcome }}" != "success" || "${{ steps.unit.outcome }}" != "success" ]]; then
            exit 1
          fi
