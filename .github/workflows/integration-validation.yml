name: Integration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-photo-batch2-vetted.mjs'
      - 'scripts/seed-photo-batch2-vetted.mjs'
      - '.github/workflows/integration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-photo-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout actual integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 1
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate reviewed photo data
        run: node scripts/seed-photo-batch2-vetted.mjs

      - name: Run apply and capture exact failure
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/photo-batch2-diagnostic
          {
            echo "working_directory=$PWD"
            echo "branch=$(git branch --show-current)"
            echo "head=$(git rev-parse HEAD)"
            node scripts/apply-photo-batch2-vetted.mjs
          } 2>&1 | tee /tmp/photo-batch2-diagnostic/apply.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload apply diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-batch2-apply-diagnostic
          path: /tmp/photo-batch2-diagnostic/**
          if-no-files-found: error
          retention-days: 7

      - name: Stop when apply failed
        if: steps.apply.outcome != 'success'
        run: exit 1
