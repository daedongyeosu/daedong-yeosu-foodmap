name: Integration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'data/**'
      - 'images/notion-stores/**'
      - 'assets/store-photos/**'
      - 'assets/notion-store-photos/**'
      - 'assets/photo-batch-2-vetted/**'
      - 'scripts/**'
      - '.github/workflows/integration-validation.yml'
  push:
    branches: [agent/main-unification]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply staged revalidated photo batch 2 once
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .integration/photo-batch2-revalidated ]]; then
            echo '재검수 적용 대기자료가 없어 건너뜁니다.'
            exit 0
          fi
          cat .integration/photo-batch2-revalidated/text-part-*.b64 | base64 -d > /tmp/photo-batch2-text.zip
          echo 'eb115636ebd62fcf4ac5eed76d81df6de5c08e6829b52f9e2ea9e00bd09e04dd  /tmp/photo-batch2-text.zip' | sha256sum -c -
          unzip -oq /tmp/photo-batch2-text.zip -d .
          rm -rf .integration/photo-batch2-revalidated
          node scripts/apply-photo-batch2-vetted.mjs
          node scripts/validate-photo-batch2-vetted.mjs
          git config user.name 'daedong-photo-revalidation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m '[photo-batch2-generated] 2차 사진 재검수 안전 적용'
          git push origin HEAD:agent/main-unification

      - name: Verify no repository files were deleted
        id: no_deletions
        continue-on-error: true
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --diff-filter=D --name-only origin/main...HEAD | tee deleted-files.txt
          test ! -s deleted-files.txt

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Inventory data sources
        shell: bash
        run: node scripts/inventory-data-sources.mjs 2>&1 | tee data-inventory.txt

      - name: Compare DB790 working branch
        id: db790
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git fetch origin fix/load-stores-db790 --depth=1
          DB790_REF=FETCH_HEAD
          rm -rf /tmp/db790-worktree
          git worktree add --detach /tmp/db790-worktree "$DB790_REF"
          mkdir -p db790-source/reports
          cp /tmp/db790-worktree/data/stores.json db790-source/stores.json
          for file in \
            notion-sync-summary.json \
            notion-sync-report.json \
            notion-complete-import-report.json \
            notion-import-missing-report.json \
            store-dedup-report.json \
            photo-filter-report.json \
            photo-match-safety-report.json \
            photo-manifest.json \
            notion-photo-manifest.json \
            notion-photo-apply-report.json \
            photo-coverage-resolution.json; do
            if [[ -f "/tmp/db790-worktree/data/$file" ]]; then
              cp "/tmp/db790-worktree/data/$file" "db790-source/reports/$file"
            fi
          done
          node scripts/inventory-data-sources.mjs /tmp/db790-worktree 2>&1 | tee db790-data-inventory.txt
          {
            echo '[DB790 branch markers]'
            cat /tmp/db790-worktree/DB790_READY.txt 2>/dev/null || true
            cat /tmp/db790-worktree/README_DB790_TEST.txt 2>/dev/null || true
            echo
            echo '[DB790 related files]'
            git -C /tmp/db790-worktree ls-tree -r --name-only HEAD | grep -Ei '(^data/|photo|db790|notion|route|address)' | sort
          } > db790-branch-inventory.txt
          node scripts/compare-store-databases.mjs data/stores.json db790-source/stores.json db790-comparison.json 2>&1 | tee db790-comparison.txt

      - name: Prepare selective DB790 import preview
        id: db790_prepare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/prepare-db790-import.mjs /tmp/db790-worktree build/db790-import 2>&1 | tee db790-import-prepare.txt
          node scripts/compare-store-databases.mjs data/stores.json build/db790-import/stores.json db790-import-comparison.json 2>&1 | tee db790-import-comparison.txt

      - name: Inventory photo packages
        shell: bash
        run: node scripts/inventory-photo-packages.mjs 2>&1 | tee photo-inventory.txt

      - name: Inspect photo package encoding
        shell: bash
        run: node scripts/inspect-photo-parts.mjs 2>&1 | tee photo-parts-inspection.txt

      - name: Test safe photo assembly
        id: photo_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/build-photo-batch-1.mjs 2>&1 | tee photo-build.txt

      - name: Validate vetted photo batch 2
        id: photo_batch2
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-photo-batch2-vetted.mjs 2>&1 | tee photo-batch2-validation.txt

      - name: Export complete referenced-photo review bundle
        id: photo_review_bundle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/export-photo-review-bundle.mjs 2>&1 | tee photo-review-bundle.txt

      - name: Run integration validation
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-integration.mjs 2>&1 | tee integration-validation.txt

      - name: Run unit regression tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-app-unit.mjs 2>&1 | tee unit-tests.txt

      - name: Install Chromium browser test runtime
        id: browser_install
        continue-on-error: true
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run mobile browser smoke tests
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-smoke.mjs 2>&1 | tee browser-smoke.txt

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-validation-report
          path: |
            deleted-files.txt
            data-inventory.txt
            db790-data-inventory.txt
            db790-branch-inventory.txt
            db790-comparison.txt
            db790-comparison.json
            db790-source/**
            db790-import-prepare.txt
            db790-import-comparison.txt
            db790-import-comparison.json
            build/db790-import/**
            photo-inventory.txt
            photo-parts-inspection.txt
            photo-build.txt
            photo-batch2-validation.txt
            photo-review-bundle.txt
            build/photo-review-bundle/**
            integration-validation.txt
            unit-tests.txt
            browser-server.log
            browser-smoke.txt
            browser-smoke-report.json
            browser-mobile.png
            browser-mobile-failure.png
          if-no-files-found: warn
          retention-days: 14

      - name: Final validation gate
        if: always()
        shell: bash
        run: |
          echo "no_deletions=${{ steps.no_deletions.outcome }}"
          echo "db790=${{ steps.db790.outcome }}"
          echo "db790_prepare=${{ steps.db790_prepare.outcome }}"
          echo "photo_build=${{ steps.photo_build.outcome }}"
          echo "photo_batch2=${{ steps.photo_batch2.outcome }}"
          echo "photo_review_bundle=${{ steps.photo_review_bundle.outcome }}"
          echo "integration=${{ steps.integration.outcome }}"
          echo "unit=${{ steps.unit.outcome }}"
          echo "browser_install=${{ steps.browser_install.outcome }}"
          echo "browser=${{ steps.browser.outcome }}"
          if [[ "${{ steps.no_deletions.outcome }}" != "success" || "${{ steps.db790_prepare.outcome }}" != "success" || "${{ steps.photo_batch2.outcome }}" != "success" || "${{ steps.photo_review_bundle.outcome }}" != "success" || "${{ steps.integration.outcome }}" != "success" || "${{ steps.unit.outcome }}" != "success" || "${{ steps.browser_install.outcome }}" != "success" || "${{ steps.browser.outcome }}" != "success" ]]; then
            exit 1
          fi
