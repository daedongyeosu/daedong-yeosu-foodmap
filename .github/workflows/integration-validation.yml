name: Final integration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.css'
      - 'app.js'
      - 'data/**'
      - 'assets/photo-batch-2-vetted/**'
      - 'scripts/**'
      - '.github/workflows/integration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-integration-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout actual integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record branch and main SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-validation-logs
          git fetch origin main --depth=1
          {
            echo "working_directory=$PWD"
            echo "branch=$(git branch --show-current)"
            echo "branch_sha=$(git rev-parse HEAD)"
            echo "main_sha=$(git rev-parse origin/main)"
          } | tee final-validation-logs/00-branch-state.log

      - name: Verify intended legacy deletions only
        shell: bash
        run: |
          set -euo pipefail
          git diff --diff-filter=D --name-only origin/main...HEAD | sort | tee final-validation-logs/01-deleted-files.log
          unexpected=$(grep -Ev '^(app-v7\.js|app-v8\.js|styles-v7\.css|styles-v8\.css|fix-v9\.css|fix-v9\.js)$' final-validation-logs/01-deleted-files.log || true)
          test -z "$unexpected"

      - name: Run static validation
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-static.mjs 2>&1 | tee final-validation-logs/02-static.log

      - name: Run unit regression tests
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-app-unit.mjs 2>&1 | tee final-validation-logs/03-unit.log

      - name: Run data validation
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-data.mjs 2>&1 | tee final-validation-logs/04-data.log

      - name: Run photo integrity validation
        shell: bash
        run: |
          set -o pipefail
          sha256sum -c SHA256SUMS.txt 2>&1 | tee final-validation-logs/05-sha256.log
          node scripts/validate-photo-batch2-vetted.mjs 2>&1 | tee final-validation-logs/06-photo-integrity.log

      - name: Install Chromium browser test runtime
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 2>&1 | tee final-validation-logs/07-playwright-install.log
          npx playwright install --with-deps chromium 2>&1 | tee final-validation-logs/08-chromium-install.log

      - name: Run mobile browser validation
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > final-validation-logs/09-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-smoke.mjs 2>&1 | tee final-validation-logs/10-mobile-browser.log

      - name: Compare integration branch with main
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status origin/main...HEAD | tee final-validation-logs/11-main-change-list.log
          git diff --stat origin/main...HEAD | tee final-validation-logs/12-main-diff-stat.log

      - name: Build final validation state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const staticReport=read('static-validation-report.json');
          const dataReport=read('data-validation-report.json');
          const photoReport=read('photo-batch2-integrity-result.json');
          const browserReport=read('browser-smoke-report.json');
          const branchSha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const mainSha=execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim();
          const changes=execFileSync('git',['diff','--name-status','origin/main...HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const deleted=changes.filter(line=>line.startsWith('D\t')).map(line=>line.slice(2));
          const state={
            success:Boolean(staticReport.success&&dataReport.success&&photoReport.success&&browserReport.success),
            branch:'agent/main-unification',branchSha,mainSha,
            pullRequest:{number:1,draft:true,merged:false},
            photoCoverage:dataReport.photoCoverage,
            secondPhotoPackage:{approvedPhotos:9,appliedStores:14,status:'active-revalidated'},
            firstPhotoPackage:{status:'incomplete',runtimeEnabled:false,missingParts:[18,19,20,21,22],coordinateIndex:false},
            results:{static:staticReport,data:dataReport,photo:{success:photoReport.success,pass:photoReport.pass,fail:photoReport.fail},browser:{success:browserReport.success,pass:browserReport.checks.length,warn:browserReport.warnings?.length||0,fail:browserReport.success?0:1}},
            changedFiles:changes,deletedFiles:deleted,generatedAt:new Date().toISOString()
          };
          if(!state.success)throw new Error('Final validation state is not successful');
          fs.writeFileSync('final-integration-state.json',JSON.stringify(state,null,2)+'\n');
          NODE

      - name: Upload final validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-integration-validation
          path: |
            final-integration-state.json
            static-validation-report.json
            data-validation-report.json
            photo-batch2-integrity-result.json
            browser-smoke-report.json
            browser-mobile.png
            browser-mobile-failure.png
            final-validation-logs/**
            payload-manifest.json
            SHA256SUMS.txt
            data/photo-manifest.json
            data/photo-policy.json
            data/photo-batch2-vetted-assets.json
            data/photo-batch2-vetted-assignments.json
            data/photo-batch2-vetted-review-decisions.json
          if-no-files-found: warn
          retention-days: 30
