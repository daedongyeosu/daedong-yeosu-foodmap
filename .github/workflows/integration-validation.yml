name: Integration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'data/**'
      - 'assets/photo-batch-2-vetted/**'
      - 'scripts/**'
      - '.github/workflows/integration-validation.yml'
      - '.github/workflows/photo-batch2-final-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integration-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout actual integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record branch and main SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/photo-batch2-logs
          git fetch origin main --depth=1
          {
            echo "working_directory=$PWD"
            echo "branch=$(git branch --show-current)"
            echo "starting_head=$(git rev-parse HEAD)"
            echo "main_sha=$(git rev-parse origin/main)"
            git status --short
          } | tee /tmp/photo-batch2-logs/00-branch-state.log
          test "$(git branch --show-current)" = 'agent/main-unification'

      - name: Verify no main files are deleted
        shell: bash
        run: |
          set -euo pipefail
          git diff --diff-filter=D --name-only origin/main...HEAD | tee /tmp/photo-batch2-logs/01-deleted-files.log
          test ! -s /tmp/photo-batch2-logs/01-deleted-files.log

      - name: Remove failed transient staging files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch \
            .integration/photo-batch2-apply \
            .integration/photo-batch2-binary \
            .integration/photo-batch2-refresh \
            .integration/photo-batch2-revalidated \
            .integration/photo-batch2-final \
            .github/workflows/apply-photo-batch2-vetted.yml \
            .github/workflows/refresh-photo-batch2-report.yml \
            scripts/refresh-photo-batch2-report.mjs \
            > /tmp/photo-batch2-logs/02-cleanup.log 2>&1 || true
          cat /tmp/photo-batch2-logs/02-cleanup.log

      - name: Generate reviewed photo data
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          node scripts/seed-photo-batch2-vetted.mjs 2>&1 | tee /tmp/photo-batch2-logs/03-seed.log

      - name: Apply vetted photos to missing-photo stores only
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          node scripts/apply-photo-batch2-vetted.mjs 2>&1 | tee /tmp/photo-batch2-logs/04-apply.log

      - name: Generate payload manifest from actual files
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          node scripts/generate-photo-batch2-payload-manifest.mjs 2>&1 | tee /tmp/photo-batch2-logs/05-generate-manifest.log

      - name: Validate photo and manifest integrity
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          node scripts/validate-photo-batch2-vetted.mjs 2>&1 | tee /tmp/photo-batch2-logs/06-photo-integrity.log

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          {
            node --check app.js
            node --check scripts/seed-photo-batch2-vetted.mjs
            node --check scripts/apply-photo-batch2-vetted.mjs
            node --check scripts/generate-photo-batch2-payload-manifest.mjs
            node --check scripts/validate-photo-batch2-vetted.mjs
          } 2>&1 | tee /tmp/photo-batch2-logs/07-syntax.log

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          node scripts/test-app-unit.mjs 2>&1 | tee /tmp/photo-batch2-logs/08-unit-tests.log

      - name: Run data and integration tests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          node scripts/validate-integration.mjs 2>&1 | tee /tmp/photo-batch2-logs/09-data-integration.log

      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 2>&1 | tee /tmp/photo-batch2-logs/10-playwright-install.log
          npx playwright install --with-deps chromium 2>&1 | tee /tmp/photo-batch2-logs/11-chromium-install.log

      - name: Run mobile browser tests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/photo-batch2-logs/12-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-smoke.mjs 2>&1 | tee /tmp/photo-batch2-logs/13-mobile-browser.log

      - name: Commit verified generated data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daedong-photo-final-verification'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            data/stores.json \
            data/photo-manifest.json \
            data/photo-batch2-structure-report.json \
            data/photo-batch2-vetted-assets.json \
            data/photo-batch2-vetted-assignments.json \
            data/photo-batch2-vetted-review-decisions.json \
            data/photo-batch2-vetted-report.json \
            payload-manifest.json \
            SHA256SUMS.txt \
            photo-batch2-integrity-result.json
          git status --short | tee /tmp/photo-batch2-logs/14-staged-files.log
          git commit -m '[photo-batch2-final] 2차 사진 실제 파일 재검증 적용'
          git push origin HEAD:agent/main-unification 2>&1 | tee /tmp/photo-batch2-logs/15-push.log
          final_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/agent/main-unification | awk '{print $1}')
          test "$final_sha" = "$remote_sha"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "remote_sha=$remote_sha" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD | tee /tmp/photo-batch2-logs/16-final-commit.log

      - name: Build complete verification package
        shell: bash
        env:
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
          REMOTE_SHA: ${{ steps.commit.outputs.remote_sha }}
        run: |
          set -euo pipefail
          package=/tmp/photo-batch2-final-verification
          rm -rf "$package"
          mkdir -p "$package"/{actual-applied-webp,data,review,logs,commit,browser,scripts,workflows}
          cp assets/photo-batch-2-vetted/{082,083,084,089,107,108,109,282,284}.webp "$package/actual-applied-webp/"
          cp data/stores.json data/photo-manifest.json "$package/data/"
          cp payload-manifest.json SHA256SUMS.txt photo-batch2-integrity-result.json "$package/"
          cp data/photo-batch2-structure-report.json "$package/review/"
          cp data/photo-batch2-vetted-assets.json "$package/review/"
          cp data/photo-batch2-vetted-assignments.json "$package/review/"
          cp data/photo-batch2-vetted-review-decisions.json "$package/review/"
          cp data/photo-batch2-vetted-report.json "$package/review/"
          cp scripts/seed-photo-batch2-vetted.mjs "$package/scripts/"
          cp scripts/apply-photo-batch2-vetted.mjs "$package/scripts/"
          cp scripts/generate-photo-batch2-payload-manifest.mjs "$package/scripts/"
          cp scripts/validate-photo-batch2-vetted.mjs "$package/scripts/"
          cp .github/workflows/integration-validation.yml "$package/workflows/"
          cp .github/workflows/photo-batch2-final-verification.yml "$package/workflows/"
          cp /tmp/photo-batch2-logs/* "$package/logs/"
          cp browser-smoke-report.json "$package/browser/"
          cp browser-mobile.png "$package/browser/"
          cp browser-mobile-failure.png "$package/browser/" 2>/dev/null || true
          printf '%s\n' "$FINAL_SHA" > "$package/commit/final-commit-sha.txt"
          printf '%s\n' "$REMOTE_SHA" > "$package/commit/remote-branch-sha.txt"
          printf '%s\n' "$(git rev-parse origin/main)" > "$package/commit/main-sha.txt"
          printf '%s\n' 'agent/main-unification' > "$package/commit/branch-name.txt"
          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const report=JSON.parse(fs.readFileSync('data/photo-batch2-vetted-report.json','utf8'));
          const payload=JSON.parse(fs.readFileSync('payload-manifest.json','utf8'));
          const assignments=JSON.parse(fs.readFileSync('data/photo-batch2-vetted-assignments.json','utf8'));
          const review=JSON.parse(fs.readFileSync('data/photo-batch2-vetted-review-decisions.json','utf8'));
          const sums=fs.readFileSync('SHA256SUMS.txt','utf8').trim().split(/\r?\n/).filter(Boolean);
          const state={
            success:true,
            verifiedAt:new Date().toISOString(),
            workingDirectory:process.cwd(),
            branch:'agent/main-unification',
            branchSha:process.env.FINAL_SHA,
            remoteBranchSha:process.env.REMOTE_SHA,
            mainSha:cp.execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim(),
            mainMerged:false,
            deployed:false,
            appliedPhotoCount:report.appliedPhotoCount,
            appliedStoreCount:report.appliedStoreCount,
            storesAwaitingPhoto:report.storesAwaitingPhoto,
            excludedPhotoCount:review.excluded.length,
            excludedPhotos:review.excluded,
            appliedStores:report.applied,
            manifestMatchedFiles:payload.fileCount,
            manifestTotalFiles:payload.files.length,
            sha256SumsMatchedFiles:sums.length,
            sha256SumsTotalFiles:sums.length,
            requiredChecks:{photoIntegrity:true,unit:true,dataIntegration:true,mobileBrowser:true,remotePush:true},
            workflowRunId:process.env.GITHUB_RUN_ID,
            workflowRunNumber:process.env.GITHUB_RUN_NUMBER
          };
          if(state.appliedPhotoCount!==9||state.appliedStoreCount!==14||state.storesAwaitingPhoto!==85||state.excludedPhotoCount!==27||state.manifestMatchedFiles!==23||state.manifestTotalFiles!==23||state.sha256SumsMatchedFiles!==24||state.sha256SumsTotalFiles!==24)throw new Error('최종 상태 수치 불일치');
          fs.writeFileSync('/tmp/photo-batch2-final-verification/final_state.json',JSON.stringify(state,null,2)+'\n');
          fs.writeFileSync('/tmp/photo-batch2-final-verification/review/applied-stores.txt',assignments.assignments.map((item,index)=>`${index+1}. ${item.storeName} | ${item.paths.join(', ')}`).join('\n')+'\n');
          fs.writeFileSync('/tmp/photo-batch2-final-verification/review/excluded-photos.txt',review.excluded.map(item=>`${item.imageId} | ${item.reason} | ${item.detail}`).join('\n')+'\n');
          NODE
          cd "$package"
          find . -type f ! -name 'PACKAGE_*' -print0 | sort -z | xargs -0 sha256sum > /tmp/preliminary-package-sums.txt
          sha256sum -c /tmp/preliminary-package-sums.txt > logs/17-package-sha-verification.log
          echo '최종 ZIP 파일 개수 검증 준비' > logs/18-package-file-count.log
          base_count=$(find . -type f ! -name 'PACKAGE_FILE_COUNT.txt' ! -name 'PACKAGE_FILE_INVENTORY.txt' ! -name 'PACKAGE_SHA256SUMS.txt' | wc -l | tr -d ' ')
          expected_count=$((base_count+3))
          echo "PACKAGE FILE COUNT EXPECTED: $expected_count" > logs/18-package-file-count.log
          printf '%s\n' "$expected_count" > PACKAGE_FILE_COUNT.txt
          { find . -type f -printf '%P\n'; echo 'PACKAGE_FILE_INVENTORY.txt'; echo 'PACKAGE_SHA256SUMS.txt'; } | sort -u > PACKAGE_FILE_INVENTORY.txt
          find . -type f ! -name PACKAGE_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > PACKAGE_SHA256SUMS.txt
          sha256sum -c PACKAGE_SHA256SUMS.txt
          actual_count=$(find . -type f | wc -l | tr -d ' ')
          inventory_count=$(wc -l < PACKAGE_FILE_INVENTORY.txt | tr -d ' ')
          test "$actual_count" = "$expected_count"
          test "$inventory_count" = "$expected_count"
          test "$(find actual-applied-webp -type f -name '*.webp' | wc -l | tr -d ' ')" = '9'
          test "$(node -p "JSON.parse(require('fs').readFileSync('final_state.json','utf8')).success")" = 'true'
          echo "PACKAGE FILE COUNT VERIFIED: $actual_count/$expected_count" >> logs/18-package-file-count.log

      - name: Upload complete verification ZIP
        uses: actions/upload-artifact@v4
        with:
          name: photo-batch2-final-verification
          path: /tmp/photo-batch2-final-verification/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: photo-batch2-final-failure-logs
          path: /tmp/photo-batch2-logs/**
          if-no-files-found: warn
          retention-days: 7
