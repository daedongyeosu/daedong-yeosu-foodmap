name: Final integration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - '*.mjs'
      - 'data/**'
      - 'assets/**'
      - 'images/**'
      - 'scripts/**'
      - 'SHA256SUMS.txt'
      - '.github/workflows/integration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-integration-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record revision and change scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch origin "$EXPECTED_BASE_REF" --no-tags
          git diff --name-status "origin/$EXPECTED_BASE_REF...HEAD" | tee integration-change-list.log
          git diff --check "origin/$EXPECTED_BASE_REF...HEAD"

      - name: Verify protected data is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "origin/$EXPECTED_BASE_REF...HEAD" -- data assets images

      - name: Run static validation
        run: node scripts/validate-static.mjs

      - name: Run unit and link-preservation tests
        run: node scripts/test-app-unit.mjs

      - name: Verify neighborhood pizza priority
        run: node pizza-neighborhood-priority-regression-test.mjs

      - name: Run data validation
        run: node scripts/validate-data.mjs

      - name: Run photo reference validation
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          node scripts/validate-photo-batch2-vetted.mjs

      - name: Install Chromium browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run mobile browser validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-smoke.mjs

      - name: Build validation summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const read = file => JSON.parse(fs.readFileSync(file, 'utf8'));
          const reports = {
            static: read('static-validation-report.json'),
            data: read('data-validation-report.json'),
            photo: read('photo-batch2-integrity-result.json'),
            browser: read('browser-smoke-report.json')
          };
          const state = {
            success: Object.values(reports).every(report => report.success),
            branchSha: execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(),
            mainSha: execFileSync('git', ['rev-parse', 'origin/main'], {encoding: 'utf8'}).trim(),
            changedFiles: fs.readFileSync('integration-change-list.log', 'utf8').trim().split(/\r?\n/).filter(Boolean),
            reports,
            generatedAt: new Date().toISOString()
          };
          fs.writeFileSync('final-integration-state.json', `${JSON.stringify(state, null, 2)}\n`);
          if (!state.success) process.exit(1);
          NODE

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-integration-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            final-integration-state.json
            static-validation-report.json
            data-validation-report.json
            photo-batch2-integrity-result.json
            browser-smoke-report.json
            browser-mobile.png
            browser-mobile-failure.png
            browser-server.log
            integration-change-list.log
          if-no-files-found: warn
          retention-days: 30
