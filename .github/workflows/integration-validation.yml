name: Integration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'data/**'
      - 'images/notion-stores/**'
      - 'scripts/**'
      - '.github/workflows/integration-validation.yml'
  push:
    branches: [agent/main-unification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Inventory photo packages
        shell: bash
        run: node scripts/inventory-photo-packages.mjs 2>&1 | tee photo-inventory.txt

      - name: Run integration validation
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-integration.mjs 2>&1 | tee integration-validation.txt

      - name: Run unit regression tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-app-unit.mjs 2>&1 | tee unit-tests.txt

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-validation-report
          path: |
            photo-inventory.txt
            integration-validation.txt
            unit-tests.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Final validation gate
        if: always()
        shell: bash
        run: |
          echo "integration=${{ steps.integration.outcome }}"
          echo "unit=${{ steps.unit.outcome }}"
          if [[ "${{ steps.integration.outcome }}" != "success" || "${{ steps.unit.outcome }}" != "success" ]]; then
            exit 1
          fi
