name: Notion store sync

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: 'stores.json에 실제 반영할까요? 처음에는 false로 시험하세요.'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - fix/load-stores-db790
    paths:
      - 'tools/notion-import-missing-stores.mjs'
      - '.github/workflows/notion-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/load-stores-db790

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN 비밀키가 등록되지 않았습니다."
            exit 1
          fi

      - name: Preview Notion sync safely
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_changes == false }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
        run: node tools/notion-sync-dry-run.mjs

      - name: Apply Notion sync
        if: ${{ github.event_name == 'push' || inputs.apply_changes == true }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
        run: node tools/notion-sync.mjs

      - name: Import missing Notion stores
        if: ${{ github.event_name == 'push' || inputs.apply_changes == true }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
        run: node tools/notion-import-missing-stores.mjs

      - name: Check order-link quality
        run: node tools/link-quality.mjs

      - name: Commit reports only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_changes == false }}
        run: |
          git config user.name "daedong-notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/notion-sync-report.json data/link-quality-report.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "노션 동기화 시험 보고서"
          git push

      - name: Commit applied data and reports
        if: ${{ github.event_name == 'push' || inputs.apply_changes == true }}
        run: |
          git config user.name "daedong-notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/stores.json data/notion-sync-report.json data/notion-import-missing-report.json data/link-quality-report.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "노션 누락 가게와 주문링크 자동 동기화"
          git push
