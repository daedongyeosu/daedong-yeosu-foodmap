name: Notion store sync

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: '검증 후 stores.json에 실제 반영'
        required: true
        default: false
        type: boolean
      diagnostic_keywords:
        description: '누락 여부를 집중 확인할 가게명(쉼표로 구분)'
        required: false
        default: '오워래,해인이네,수라상궁,바로탕수,바오탕수'
        type: string
  push:
    branches:
      - fix/load-stores-db790
    paths:
      - 'tools/notion-complete-import.mjs'
      - 'tools/notion-import-missing-stores.mjs'
      - 'tools/notion-sync-dry-run.mjs'
      - '.github/workflows/notion-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/load-stores-db790

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN 비밀키가 등록되지 않았습니다."
            exit 1
          fi

      - name: Preview complete Notion sync safely
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_changes == false }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
        run: node tools/notion-sync-dry-run.mjs

      - name: Import every accessible Notion store
        if: ${{ github.event_name == 'push' || inputs.apply_changes == true }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
        run: node tools/notion-complete-import.mjs

      - name: Apply Notion route sync
        if: ${{ github.event_name == 'push' || inputs.apply_changes == true }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
        run: node tools/notion-sync.mjs

      - name: Diagnose and import missing Notion stores
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
          APPLY_CHANGES: ${{ github.event_name == 'push' || inputs.apply_changes == true }}
          DIAGNOSTIC_KEYWORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_keywords || '오워래,해인이네,수라상궁,바로탕수,바오탕수' }}
        run: node tools/notion-import-missing-stores.mjs

      - name: Check order-link quality
        run: node tools/link-quality.mjs

      - name: Show diagnosis summary
        run: |
          node -e "const fs=require('fs'); const files=['data/notion-complete-import-report.json','data/notion-import-missing-report.json']; for(const f of files){if(fs.existsSync(f)){const r=require('./'+f); console.log(f, JSON.stringify({accessiblePages:r.accessiblePages||r.pagesVisibleToIntegration,addedCount:r.addedCount,excludedCount:r.excludedCount,skippedCount:r.skippedCount,errorCount:r.errorCount},null,2));}}"

      - name: Upload sync and diagnosis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-sync-reports
          path: |
            data/notion-complete-import-report.json
            data/notion-sync-report.json
            data/notion-import-missing-report.json
            data/link-quality-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit reports only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_changes == false }}
        run: |
          git config user.name "daedong-notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/notion-complete-import-report.json data/notion-sync-report.json data/notion-import-missing-report.json data/link-quality-report.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "노션 전체 가게 완전 동기화 진단 보고서"
          git push

      - name: Commit applied data and reports
        if: ${{ github.event_name == 'push' || inputs.apply_changes == true }}
        run: |
          git config user.name "daedong-notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/stores.json data/notion-complete-import-report.json data/notion-sync-report.json data/notion-import-missing-report.json data/link-quality-report.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "노션 등록 가게 전체 자동 동기화"
          git push
