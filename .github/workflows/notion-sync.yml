name: Notion store sync

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: '검증 후 stores.json에 실제 반영'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/load-stores-db790
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run safe Notion sync preview
        if: ${{ !inputs.apply_changes }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ''
        run: node tools/notion-sync-dry-run.mjs

      - name: Run Notion sync and link quality check
        if: ${{ inputs.apply_changes }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ''
        run: |
          node tools/notion-sync.mjs
          node tools/link-quality.mjs

      - name: Create compact summary
        if: always()
        run: |
          if [ -f data/notion-sync-report.json ]; then
            node tools/summarize-notion-report.mjs
          else
            echo "notion-sync-report.json was not created"
            exit 1
          fi

      - name: Upload preview reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-sync-reports
          if-no-files-found: error
          path: |
            data/notion-sync-report.json
            data/notion-sync-summary.json
            data/link-quality-report.json

      - name: Commit reports only
        if: ${{ !inputs.apply_changes }}
        run: |
          git config user.name "daedong-notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/notion-sync-report.json data/notion-sync-summary.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "노션 안전 시험 보고서와 요약 갱신"
          git push origin HEAD:fix/load-stores-db790

      - name: Commit synchronized data
        if: ${{ inputs.apply_changes }}
        run: |
          git config user.name "daedong-notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/stores.json data/notion-sync-report.json data/notion-sync-summary.json data/link-quality-report.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "노션 주문정보 자동 동기화"
          git push origin HEAD:fix/load-stores-db790
