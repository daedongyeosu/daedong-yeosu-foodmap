name: Notion store sync

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: '검증 후 stores.json에 실제 반영'
        required: true
        default: false
        type: boolean
      diagnostic_keywords:
        description: '누락 여부를 집중 확인할 가게명(쉼표로 구분)'
        required: false
        default: '아구회관,아도쿄,오워래,해인이네,수라상궁,바로탕수,바오탕수'
        type: string
  schedule:
    - cron: '23 * * * *'
  push:
    branches:
      - fix/load-stores-db790
    paths:
      - 'tools/notion-complete-import.mjs'
      - 'tools/notion-import-missing-stores.mjs'
      - 'tools/notion-sync-dry-run.mjs'
      - 'tools/notion-sync.mjs'
      - 'tools/dedupe-stores.mjs'
      - 'tools/photo-prefix-overrides.mjs'
      - 'tools/apply-photo-manifest-strict.mjs'
      - '.github/workflows/notion-sync.yml'

permissions:
  contents: write

# 노션·사진·고객신고가 같은 stores.json을 동시에 수정하지 못하게 한다.
concurrency:
  group: daedong-data-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/load-stores-db790
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN 비밀키가 등록되지 않았습니다."
            exit 1
          fi

      - name: Preview complete Notion sync safely
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_changes == false }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
          APPLY_CHANGES: 'false'
          DIAGNOSTIC_KEYWORDS: ${{ inputs.diagnostic_keywords }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/notion-sync-dry-run.mjs
          node tools/notion-import-missing-stores.mjs
          node tools/link-quality.mjs

      - name: Recalculate latest Notion and photo data, then save
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.apply_changes == true }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
          DIAGNOSTIC_KEYWORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_keywords || '아구회관,아도쿄,오워래,해인이네,수라상궁,바로탕수,바오탕수' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "daedong-notion-sync"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "최신 데이터 기준 노션 동기화 시도 ${attempt}/3"
            git fetch origin fix/load-stores-db790
            git reset --hard origin/fix/load-stores-db790

            node tools/notion-complete-import.mjs
            node tools/notion-sync.mjs
            APPLY_CHANGES=true node tools/notion-import-missing-stores.mjs
            APPLY_CHANGES=true node tools/dedupe-stores.mjs

            if [ -f data/photo-manifest.json ] && [ -d assets/store-photos ]; then
              PHOTO_SAFETY_PHASE=pre node tools/photo-match-safety.mjs
              node tools/photo-prefix-overrides.mjs
              node tools/apply-photo-manifest-strict.mjs
              PHOTO_SAFETY_PHASE=post node tools/photo-match-safety.mjs
            fi

            node tools/link-quality.mjs

            git add -f data/stores.json data/notion-complete-import-report.json data/notion-sync-report.json data/notion-import-missing-report.json data/store-dedup-report.json data/stores.before-dedup.json data/link-quality-report.json data/photo-apply-report.json data/photo-match-action-report.json data/photo-prefix-match-report.json data/photo-match-overrides.json data/photo-match-safety-report.json data/stores.before-photo-apply.json

            if git diff --cached --quiet; then
              echo "노션 동기화 변경 없음"
              exit 0
            fi

            git commit -m "노션 가게 동기화와 앞부분 가게명 기준 사진 재매칭"
            if git push origin HEAD:fix/load-stores-db790; then
              echo "노션 동기화와 사진 재매칭 저장 완료"
              exit 0
            fi

            echo "다른 변경이 먼저 저장되어 최신 데이터로 다시 계산합니다."
            sleep 8
          done

          echo "세 번 다시 계산했지만 저장하지 못했습니다."
          exit 1

      - name: Upload sync and diagnosis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-sync-reports
          path: |
            data/notion-complete-import-report.json
            data/notion-sync-report.json
            data/notion-import-missing-report.json
            data/store-dedup-report.json
            data/stores.before-dedup.json
            data/link-quality-report.json
            data/photo-apply-report.json
            data/photo-match-action-report.json
            data/photo-prefix-match-report.json
            data/photo-match-safety-report.json
          if-no-files-found: warn
          retention-days: 14
