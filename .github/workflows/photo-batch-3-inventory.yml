name: photo-batch-3 one-shot apply

on:
  push:
    branches: [feature/photo-batch-3]
    paths: [data/photo-batch3-upload/READY]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/photo-batch-3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply vetted photos and validate
        run: |
          node scripts/apply-photo-batch3.mjs
          node scripts/validate-photo-batch3-vetted.mjs
          node scripts/validate-data.mjs
      - name: Commit only to feature branch
        run: |
          rm -rf data/photo-batch3-upload
          rm -f scripts/apply-photo-batch3.mjs
          rm -f data/photo-batch3-work-status.md data/photo-batch3-trigger.txt
          rm -f .github/workflows/photo-batch-3-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '3차 가게사진 검수 적용'
          git push origin HEAD:feature/photo-batch-3
