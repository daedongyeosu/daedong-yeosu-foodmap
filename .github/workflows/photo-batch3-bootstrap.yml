name: Photo batch 3 canonical bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/photo-batch3-mini/READY'
      - '.github/workflows/photo-batch3-bootstrap.yml'
  push:
    branches: [feature/photo-batch-3-refresh]
    paths:
      - '.github/photo-batch3-mini/READY'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  install:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone exact photo branch with write credentials
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone -q --depth 1 --branch feature/photo-batch-3-refresh "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git fetch -q --depth 1 origin ecfc1f7d053914c7f6d4d9be9edbc88740534d0d
      - name: Verify and execute canonical installer
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/photo-batch3-installer -maxdepth 1 -type f -name 'part-*' | wc -l)" = '5'
          cat .github/photo-batch3-installer/part-* > /tmp/photo-batch3-install.sh
          echo '58473b04cf3f4002e4fcc3f0ddca986cd473110a391c717608f79994bc3156f3  /tmp/photo-batch3-install.sh' | sha256sum -c -
          bash -n /tmp/photo-batch3-install.sh
          set +e
          bash /tmp/photo-batch3-install.sh > /tmp/photo-batch3-install.log 2>&1
          status=$?
          set -e
          cat /tmp/photo-batch3-install.log
          exit $status
