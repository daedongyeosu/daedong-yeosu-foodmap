name: Photo batch 3 canonical bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/photo-batch3-mini/READY'
      - '.github/workflows/photo-batch3-bootstrap.yml'
  push:
    branches: [feature/photo-batch-3-refresh]
    paths:
      - '.github/photo-batch3-mini/READY'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  install:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/photo-batch-3-refresh
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and execute canonical installer
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/photo-batch3-installer -maxdepth 1 -type f -name 'part-*' | wc -l)" = '3'
          cat .github/photo-batch3-installer/part-* > /tmp/photo-batch3-install.sh
          echo '511e08a6974ee7d45bc4550e42a64dee532ba1654a69dca72c2a4655f2d2bdc4  /tmp/photo-batch3-install.sh' | sha256sum -c -
          bash -n /tmp/photo-batch3-install.sh
          set +e
          bash /tmp/photo-batch3-install.sh > /tmp/photo-batch3-install.log 2>&1
          status=$?
          set -e
          tail -n 160 /tmp/photo-batch3-install.log
          exit $status
