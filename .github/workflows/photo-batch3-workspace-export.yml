name: Photo batch 3 transport audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/photo-batch3-workspace-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-transport-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout photo branch
        uses: actions/checkout@v4
        with:
          ref: feature/photo-batch-3-refresh
          fetch-depth: 0
          show-progress: false

      - name: Audit temporary transport files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport-audit
          cp -R .github/photo-batch3-payload transport-audit/
          find .github/photo-batch3-payload -type f -printf '%P\t%s\n' | sort > transport-audit/file-sizes.tsv
          sha256sum .github/photo-batch3-payload/* > transport-audit/file-sha256.txt
          git rev-parse HEAD > transport-audit/head-sha.txt

      - name: Upload temporary transport audit
        uses: actions/upload-artifact@v4
        with:
          name: photo-batch3-transport-audit-${{ github.run_id }}
          path: transport-audit
          if-no-files-found: error
          retention-days: 3
