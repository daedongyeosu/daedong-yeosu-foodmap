name: Photo viewer mobile test target fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/photo-viewer-mobile-test-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-approved-ux
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Click the actually visible cloned slide image
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='scripts/approved-ux-mobile.mjs';
          let text=fs.readFileSync(path,'utf8');
          const old="await page.locator('#detailPhotoCarousel .detail-photo:visible').first().click();";
          const replacement="await page.evaluate(()=>{const root=document.querySelector('#detailPhotoCarousel'),frame=root.querySelector('.detail-photo-frame').getBoundingClientRect(),image=[...root.querySelectorAll('.detail-photo')].find(img=>{const r=img.getBoundingClientRect();return r.right>frame.left&&r.left<frame.right&&r.bottom>frame.top&&r.top<frame.bottom});if(!image)throw new Error('active detail photo not found');image.click();});";
          const count=text.split(old).length-1;
          if(count!==2) throw new Error(`expected two viewer click targets, found ${count}`);
          text=text.replaceAll(old,replacement);
          fs.writeFileSync(path,text);
          NODE
          node --check scripts/approved-ux-mobile.mjs
          node scripts/validate-static.mjs
          node scripts/test-app-unit.mjs
      - name: Commit mobile test correction
        run: |
          git checkout -- static-validation-report.json 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/approved-ux-mobile.mjs
          git commit -m '무한슬라이드 실제 표시사진 클릭 검사 보정'
          git push origin HEAD:fix/restore-approved-ux
