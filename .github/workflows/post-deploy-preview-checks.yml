name: Verify deployed production

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: verify-deployed-production
  cancel-in-progress: true

jobs:
  verify-deployed-production:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install mobile browser checker
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify deployed production core flow
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-smoke.mjs
      - name: Verify deployed Notion banner return
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-notion-hero-return.mjs
      - name: Verify deployed rider recruitment banner
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-rider-evergreen-banner.mjs
      - name: Verify safe deployed Mukkebi popup on fresh home entry
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-mukkebi-safe-fresh-entry.mjs
      - name: Verify deployed Yeosu life news and CHAK guide
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-yeosu-life-chak.mjs
      - name: Verify deployed menu prices and membership labels stay hidden
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-global-menu-price-hide.mjs
      - name: Verify deployed former managed stores stay behind ordinary stores
        env:
          BASE_URL: https://daedongmap.com
          PERF_PROXY_API_ORIGIN: https://daedong-yeosu-data-api.sisakim.workers.dev
          PERF_REQUEST_ORIGIN: https://daedongmap.com
        run: node scripts/browser-former-managed-stores-bottom.mjs
      - name: Verify nine deployed store campaign maps
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-store-campaign-nine.mjs
      - name: Verify deployed other order methods mobile touch
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-other-order-method-touch.mjs
      - name: Verify exact return from every order app
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-all-order-app-exact-return.mjs
      - name: Enforce deployed customer mobile performance budget
        env:
          BASE_URL: https://daedongmap.com
        run: node scripts/browser-customer-performance-budget.mjs
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployed-production-verification
          path: |
            browser-smoke-report.json
            browser-mobile.png
            browser-mobile-failure.png
            browser-notion-hero-return-report.json
            browser-notion-hero-return-immediate.png
            browser-notion-hero-return-settled.png
            browser-rider-evergreen-banner-report.json
            browser-rider-evergreen-banner.png
            browser-rider-evergreen-popup.png
            browser-rider-evergreen-failure.png
            browser-mukkebi-safe-fresh-entry-report.json
            browser-mukkebi-safe-fresh-entry-popup.png
            browser-mukkebi-safe-fresh-entry-menu.png
            artifacts/yeosu-life-home-390x844.png
            artifacts/chak-guide-390x844.png
            browser-global-menu-price-hide-report.json
            browser-global-menu-price-hide.png
            browser-global-menu-price-hide-failure.png
            browser-store-campaign-nine-report.json
            browser-store-campaign-nine.png
            browser-other-order-method-touch-report.json
            browser-other-order-method-touch-vons.png
            browser-other-order-method-touch-handsu.png
            browser-other-order-method-touch-failure.png
            browser-all-order-app-exact-return-report.json
            browser-order-return-*.png
            browser-customer-performance-budget-report.json
            browser-customer-performance-budget.png
            browser-customer-performance-budget-failure.png
          if-no-files-found: ignore
          retention-days: 14
