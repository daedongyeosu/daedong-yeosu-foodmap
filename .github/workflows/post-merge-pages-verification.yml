name: Post-merge Pages verification

on:
  push:
    branches: [agent/post-merge-pages-check]
    paths:
      - '.github/workflows/post-merge-pages-verification.yml'

permissions:
  contents: read
  actions: read
  pages: read
  deployments: read

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v4
        with:
          ref: 78fcfebd0cb9bf760dd3d3703e910efd0a9382a6
          fetch-depth: 1
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p post-merge-pages-evidence/logs
          {
            echo 'merge_sha=78fcfebd0cb9bf760dd3d3703e910efd0a9382a6'
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "repository=$GITHUB_REPOSITORY"
            echo "verification_run_id=$GITHUB_RUN_ID"
          } | tee post-merge-pages-evidence/logs/00-state.log
          test "$(git rev-parse HEAD)" = '78fcfebd0cb9bf760dd3d3703e910efd0a9382a6'

      - name: Poll GitHub Pages deployment APIs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          success=false
          pages_url=''
          for attempt in $(seq 1 60); do
            curl -fsSL "${auth[@]}" "$api/pages" -o post-merge-pages-evidence/pages-api.json
            pages_url=$(jq -r '.html_url // empty' post-merge-pages-evidence/pages-api.json)
            pages_status=$(jq -r '.status // empty' post-merge-pages-evidence/pages-api.json)

            curl -fsSL "${auth[@]}" "$api/actions/runs?head_sha=78fcfebd0cb9bf760dd3d3703e910efd0a9382a6&per_page=100" -o post-merge-pages-evidence/actions-runs.json
            jq '[.workflow_runs[] | select((.name|ascii_downcase|contains("pages")) or (.path|ascii_downcase|contains("pages")))]' post-merge-pages-evidence/actions-runs.json > post-merge-pages-evidence/pages-action-runs.json
            action_status=$(jq -r 'sort_by(.created_at) | last | .status // empty' post-merge-pages-evidence/pages-action-runs.json)
            action_conclusion=$(jq -r 'sort_by(.created_at) | last | .conclusion // empty' post-merge-pages-evidence/pages-action-runs.json)
            action_run_id=$(jq -r 'sort_by(.created_at) | last | .id // empty' post-merge-pages-evidence/pages-action-runs.json)
            action_url=$(jq -r 'sort_by(.created_at) | last | .html_url // empty' post-merge-pages-evidence/pages-action-runs.json)

            curl -fsSL "${auth[@]}" "$api/deployments?sha=78fcfebd0cb9bf760dd3d3703e910efd0a9382a6&environment=github-pages&per_page=20" -o post-merge-pages-evidence/pages-deployments.json || echo '[]' > post-merge-pages-evidence/pages-deployments.json
            deployment_id=$(jq -r 'first | .id // empty' post-merge-pages-evidence/pages-deployments.json)
            deployment_state=''
            if [[ -n "$deployment_id" ]]; then
              curl -fsSL "${auth[@]}" "$api/deployments/$deployment_id/statuses?per_page=20" -o post-merge-pages-evidence/pages-deployment-statuses.json
              deployment_state=$(jq -r 'first | .state // empty' post-merge-pages-evidence/pages-deployment-statuses.json)
            else
              echo '[]' > post-merge-pages-evidence/pages-deployment-statuses.json
            fi

            printf 'attempt=%s pages_status=%s action_status=%s action_conclusion=%s action_run_id=%s deployment_state=%s pages_url=%s\n' \
              "$attempt" "$pages_status" "$action_status" "$action_conclusion" "$action_run_id" "$deployment_state" "$pages_url" | tee -a post-merge-pages-evidence/logs/01-pages-poll.log

            if [[ "$action_status" == 'completed' && "$action_conclusion" == 'success' ]]; then success=true; break; fi
            if [[ "$deployment_state" == 'success' && "$pages_status" == 'built' ]]; then success=true; break; fi
            sleep 10
          done
          test "$success" = true
          test -n "$pages_url"
          {
            echo "PAGES_URL=$pages_url"
            echo "PAGES_ACTION_RUN_ID=$action_run_id"
            echo "PAGES_ACTION_URL=$action_url"
            echo "PAGES_ACTION_CONCLUSION=$action_conclusion"
            echo "PAGES_DEPLOYMENT_STATE=$deployment_state"
            echo "PAGES_API_STATUS=$pages_status"
          } >> "$GITHUB_ENV"

      - name: Verify public Pages response
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 40); do
            code=$(curl -L -sS -o post-merge-pages-evidence/public-index.html -D post-merge-pages-evidence/public-headers.txt -w '%{http_code}' "$PAGES_URL?merge=78fcfebd0cb9bf760dd3d3703e910efd0a9382a6&attempt=$attempt" || true)
            printf 'attempt=%s http=%s url=%s\n' "$attempt" "$code" "$PAGES_URL" | tee -a post-merge-pages-evidence/logs/02-public-poll.log
            if [[ "$code" == '200' ]] && grep -q '대동여수음식지도' post-merge-pages-evidence/public-index.html && grep -q 'app.css?v=final-integration-1' post-merge-pages-evidence/public-index.html && grep -q 'app.js?v=final-integration-1' post-merge-pages-evidence/public-index.html; then
              success=true
              break
            fi
            sleep 10
          done
          test "$success" = true

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 2>&1 | tee post-merge-pages-evidence/logs/03-playwright-install.log
          npx playwright install --with-deps chromium 2>&1 | tee post-merge-pages-evidence/logs/04-chromium-install.log

      - name: Run full mobile check against public Pages
        shell: bash
        run: |
          set -o pipefail
          BASE_URL="$PAGES_URL" node scripts/browser-smoke.mjs 2>&1 | tee post-merge-pages-evidence/logs/05-public-mobile.log
          cp browser-smoke-report.json post-merge-pages-evidence/public-browser-smoke-report.json
          cp browser-mobile.png post-merge-pages-evidence/public-browser-mobile.png

      - name: Build final Pages report
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const browser=JSON.parse(fs.readFileSync('post-merge-pages-evidence/public-browser-smoke-report.json','utf8'));
          const pages=JSON.parse(fs.readFileSync('post-merge-pages-evidence/pages-api.json','utf8'));
          const actions=JSON.parse(fs.readFileSync('post-merge-pages-evidence/pages-action-runs.json','utf8'));
          const deployments=JSON.parse(fs.readFileSync('post-merge-pages-evidence/pages-deployment-statuses.json','utf8'));
          const latestAction=[...actions].sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))).at(-1)||null;
          const report={
            success:Boolean(browser.success && process.env.PAGES_ACTION_CONCLUSION==='success'),
            mergeCommitSha:'78fcfebd0cb9bf760dd3d3703e910efd0a9382a6',
            pagesUrl:process.env.PAGES_URL,
            pagesApiStatus:process.env.PAGES_API_STATUS,
            pagesAction:{runId:Number(process.env.PAGES_ACTION_RUN_ID)||null,url:process.env.PAGES_ACTION_URL||null,status:latestAction?.status||null,conclusion:latestAction?.conclusion||null,headSha:latestAction?.head_sha||null},
            deploymentState:process.env.PAGES_DEPLOYMENT_STATE||null,
            mobile:{pass:browser.checks.length,warn:browser.warnings?.length||0,fail:browser.success?0:1,success:browser.success},
            pagesSource:pages.source||null,
            latestDeploymentStatus:deployments[0]||null,
            verifiedAt:new Date().toISOString()
          };
          if(!report.success) throw new Error('Post-merge Pages verification failed');
          fs.writeFileSync('post-merge-pages-evidence/post-merge-pages-report.json',JSON.stringify(report,null,2)+'\n');
          NODE

      - name: Upload post-merge Pages evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-pages-verification
          path: post-merge-pages-evidence/**
          if-no-files-found: error
          retention-days: 30
