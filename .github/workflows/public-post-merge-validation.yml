name: Public post-merge validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-post-merge-validation.yml'

permissions:
  contents: read
  actions: read
  pages: read

jobs:
  public-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MERGE_SHA: ecfc1f7d053914c7f6d4d9be9edbc88740534d0d
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact merged main SHA
        uses: actions/checkout@v4
        with:
          ref: ecfc1f7d053914c7f6d4d9be9edbc88740534d0d
          fetch-depth: 0
          show-progress: false

      - name: Prove current main and preserved branches
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          main_remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          backup_remote="$(git ls-remote origin refs/heads/backup/pre-approved-ux-merge | awk '{print $1}')"
          work_remote="$(git ls-remote origin refs/heads/fix/restore-approved-ux | awk '{print $1}')"
          test "$actual" = "$MERGE_SHA"
          test "$main_remote" = "$MERGE_SHA"
          test "$backup_remote" = "618d4c2f5768a1ffdee3c4a6508e9201c883ff43"
          test "$work_remote" = "3eb61334c2c6ac54f06d66c7519857e6ae5e02e0"
          python3 - <<'PY'
          import json, os, subprocess
          def ref(name):
              out=subprocess.check_output(['git','ls-remote','origin',f'refs/heads/{name}'],text=True).strip()
              return out.split()[0] if out else ''
          proof={
            'repository':os.environ['GITHUB_REPOSITORY'],
            'githubRunId':int(os.environ['GITHUB_RUN_ID']),
            'githubRunAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'runnerEnvironment':os.environ.get('RUNNER_ENVIRONMENT',''),
            'runnerOs':os.environ['RUNNER_OS'],
            'runnerArch':os.environ['RUNNER_ARCH'],
            'mergeSha':os.environ['MERGE_SHA'],
            'actualCheckedOutSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'mainSha':ref('main'),
            'backupBranch':'backup/pre-approved-ux-merge',
            'backupSha':ref('backup/pre-approved-ux-merge'),
            'preservedWorkBranch':'fix/restore-approved-ux',
            'preservedWorkBranchSha':ref('fix/restore-approved-ux')
          }
          json.dump(proof,open('public-validation-provenance.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(proof,ensure_ascii=False,indent=2))
          PY

      - name: Wait for Pages deployment success and record Run ID
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 36); do
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100" > actions-runs.json
            python3 - <<'PY' > pages-candidate.json
          import json, os
          data=json.load(open('actions-runs.json'))
          sha=os.environ['MERGE_SHA']
          candidates=[]
          for run in data.get('workflow_runs',[]):
              name=str(run.get('name',''))
              path=str(run.get('path',''))
              if run.get('head_sha')==sha and run.get('head_branch')=='main' and ('pages' in name.lower() or 'pages' in path.lower() or 'deploy github pages' in name.lower()):
                  candidates.append(run)
          candidates.sort(key=lambda x:x.get('created_at',''),reverse=True)
          chosen=candidates[0] if candidates else None
          json.dump(chosen or {},open('/dev/stdout','w'),ensure_ascii=False,indent=2)
          PY
            status="$(python3 -c "import json; d=json.load(open('pages-candidate.json')); print(d.get('status',''))")"
            conclusion="$(python3 -c "import json; d=json.load(open('pages-candidate.json')); print(d.get('conclusion') or '')")"
            run_id="$(python3 -c "import json; d=json.load(open('pages-candidate.json')); print(d.get('id',''))")"
            echo "Pages candidate attempt=$attempt run_id=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              cp pages-candidate.json pages-deployment-run.json
              echo "PAGES_RUN_ID=$run_id" >> "$GITHUB_ENV"
              found=1
              break
            fi
            if [ "$status" = "completed" ] && [ -n "$conclusion" ] && [ "$conclusion" != "success" ]; then
              echo "Pages deployment failed: $conclusion" >&2
              exit 1
            fi
            sleep 10
          done
          test "$found" = "1"
          gh api -X GET "repos/$GITHUB_REPOSITORY/pages" > pages-site.json
          PUBLIC_URL="$(python3 -c "import json; print(json.load(open('pages-site.json'))['html_url'].rstrip('/') + '/')")"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          gh api -X GET "repos/$GITHUB_REPOSITORY/pages/deployments/$MERGE_SHA" > pages-deployment-status.json || true
          cat pages-deployment-run.json
          cat pages-site.json

      - name: Verify public files are the merged main bytes, not cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-fetched
          for file in index.html app.css app.js; do
            curl --fail --location --silent --show-error \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${PUBLIC_URL}${file}?main=${MERGE_SHA}&t=${GITHUB_RUN_ID}" -o "public-fetched/$file"
            cmp --silent "$file" "public-fetched/$file"
          done
          python3 - <<'PY'
          import hashlib,json,os
          rows=[]
          for name in ['index.html','app.css','app.js']:
              def sha(path): return hashlib.sha256(open(path,'rb').read()).hexdigest()
              rows.append({'file':name,'mainSha256':sha(name),'publicSha256':sha('public-fetched/'+name),'identical':open(name,'rb').read()==open('public-fetched/'+name,'rb').read()})
          out={'mergeSha':os.environ['MERGE_SHA'],'publicUrl':os.environ['PUBLIC_URL'],'files':rows,'allIdentical':all(r['identical'] for r in rows)}
          json.dump(out,open('public-file-byte-proof.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Local integrity checks on the merged SHA
        run: |
          node scripts/validate-static.mjs
          node scripts/test-app-unit.mjs
          node scripts/validate-data.mjs
          sha256sum -c SHA256SUMS.txt
          node scripts/validate-photo-batch2-vetted.mjs

      - name: Install mobile Chromium on GitHub-hosted runner
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run the full 45-check mobile flow against the public Pages URL
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_URL="${PUBLIC_URL}?view=before&sha=${MERGE_SHA}" \
          AFTER_URL="${PUBLIC_URL}?view=public&sha=${MERGE_SHA}" \
          node scripts/approved-ux-mobile.mjs

      - name: Public-only broken image, duplicate modal and overflow audit
        shell: bash
        run: |
          cat > public-extra-audit.mjs <<'NODE'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const url=process.env.PUBLIC_URL+'?audit='+process.env.MERGE_SHA+'&run='+process.env.GITHUB_RUN_ID;
          const report={url,startedAt:new Date().toISOString(),checks:[],warn:[],fail:[],consoleErrors:[]};
          const pass=(name,details={})=>report.checks.push({name,details});
          const fail=(name,details={})=>report.fail.push({name,details});
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,locale:'ko-KR',permissions:['geolocation'],geolocation:{latitude:34.7604,longitude:127.6622}});
          const page=await context.newPage();
          page.on('pageerror',e=>report.consoleErrors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push('console: '+m.text())});
          await page.addInitScript(()=>{const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});localStorage.setItem('hideStartup',today)});
          await page.goto(url,{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#storeGrid .store-card',{timeout:120000});
          await page.screenshot({path:'public-final-home.png',fullPage:false});
          const home=await page.evaluate(async()=>{
            const images=[...document.querySelectorAll('img[src]')];
            await Promise.all(images.map(img=>img.complete?null:new Promise(r=>{img.addEventListener('load',r,{once:true});img.addEventListener('error',r,{once:true});setTimeout(r,8000)})));
            return {broken:images.filter(i=>i.naturalWidth===0).map(i=>i.getAttribute('src')),overflow:document.documentElement.scrollWidth-innerWidth,modalIds:{modal:document.querySelectorAll('#modal').length,overlay:document.querySelectorAll('#overlay').length,viewer:document.querySelectorAll('#photoViewer').length}};
          });
          home.broken.length===0?pass('홈 깨진 이미지 0',home):fail('홈 깨진 이미지',home);
          home.overflow<=2?pass('홈 가로 넘침 없음',home):fail('홈 가로 넘침',home);
          Object.values(home.modalIds).every(v=>v===1)?pass('팝업 루트 중복 없음',home):fail('팝업 루트 중복',home);
          await page.locator('#locationBtn').click();await page.waitForSelector('#modal.address-modal:not([hidden])');await page.screenshot({path:'public-address-popup.png'});await page.locator('.modal-close').click();
          await page.locator('#mainSearch').fill('LA통닭&포차 여서본점');await page.locator('#searchBtn').click();await page.waitForSelector('#storeGrid .store-card');await page.locator('#storeGrid .store-card').first().click();await page.waitForSelector('#modal.store-modal:not([hidden])');await page.screenshot({path:'public-store-detail.png'});
          const detail=await page.evaluate(()=>({overflow:document.querySelector('.store-modal .modal-card').scrollWidth-document.querySelector('.store-modal .modal-card').clientWidth,visibleModals:document.querySelectorAll('.modal:not([hidden])').length}));
          detail.overflow<=2?pass('상세팝업 가로 넘침 없음',detail):fail('상세팝업 가로 넘침',detail);
          detail.visibleModals===1?pass('팝업 중복 표시 없음',detail):fail('팝업 중복 표시',detail);
          await page.evaluate(()=>{const root=document.querySelector('#detailPhotoCarousel'),frame=root.querySelector('.detail-photo-frame').getBoundingClientRect(),img=[...root.querySelectorAll('.detail-photo')].find(i=>{const r=i.getBoundingClientRect();return r.right>frame.left&&r.left<frame.right});img?.click()});
          await page.waitForSelector('#photoViewer:not([hidden])');await page.screenshot({path:'public-photo-viewer.png'});
          await page.locator('[data-photo-viewer-close]').click();await page.waitForFunction(()=>document.querySelector('#photoViewer').hidden&& !document.querySelector('#modal').hidden);
          if(report.consoleErrors.length===0)pass('콘솔 오류 0');else fail('콘솔 오류',report.consoleErrors);
          report.finishedAt=new Date().toISOString();report.pass=report.checks.length;report.warnCount=report.warn.length;report.failCount=report.fail.length;
          fs.writeFileSync('public-extra-audit.json',JSON.stringify(report,null,2)+'\n');
          await browser.close();
          if(report.fail.length)process.exit(1);
          NODE
          PUBLIC_URL="$PUBLIC_URL" MERGE_SHA="$MERGE_SHA" node public-extra-audit.mjs

      - name: Build final public validation summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,glob,hashlib
          def load(path):
              try:return json.load(open(path,encoding='utf-8'))
              except:return None
          ux=load('approved-ux-comparison.json') or {}
          extra=load('public-extra-audit.json') or {}
          page_run=load('pages-deployment-run.json') or {}
          byteproof=load('public-file-byte-proof.json') or {}
          static=load('static-validation-report.json') or {}
          data=load('data-validation-report.json') or {}
          out={
            'mergeSha':os.environ.get('MERGE_SHA'),
            'pagesRunId':page_run.get('id'),
            'pagesRunUrl':page_run.get('html_url'),
            'pagesStatus':page_run.get('status'),
            'pagesConclusion':page_run.get('conclusion'),
            'publicUrl':os.environ.get('PUBLIC_URL'),
            'publicFilesMatchMergedMain':byteproof.get('allIdentical'),
            'mobileChecksPass':len(ux.get('checks',[])) if ux.get('success') else 0,
            'mobileConsoleErrors':len(ux.get('errors',[])),
            'extraPass':extra.get('pass',0),
            'extraWarn':extra.get('warnCount',0),
            'extraFail':extra.get('failCount',0),
            'staticSummary':static.get('summary'),
            'dataSummary':data.get('summary'),
            'backupBranch':'backup/pre-approved-ux-merge',
            'backupSha':'618d4c2f5768a1ffdee3c4a6508e9201c883ff43',
            'workBranchPreserved':True
          }
          json.dump(out,open('public-validation-summary.json','w'),ensure_ascii=False,indent=2)
          with open('public-evidence-sha256.txt','w') as f:
              for path in sorted(glob.glob('public-*.png')+glob.glob('approved-ux-*.png')+['public-validation-summary.json','public-file-byte-proof.json','pages-deployment-run.json']):
                  if os.path.exists(path):f.write(hashlib.sha256(open(path,'rb').read()).hexdigest()+'  '+path+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload public Pages validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-post-merge-${{ github.run_id }}
          path: |
            public-validation-provenance.json
            pages-deployment-run.json
            pages-deployment-status.json
            pages-site.json
            actions-runs.json
            public-file-byte-proof.json
            public-validation-summary.json
            public-evidence-sha256.txt
            approved-ux-comparison.json
            public-extra-audit.json
            static-validation-report.json
            data-validation-report.json
            approved-ux-*.png
            public-*.png
          if-no-files-found: warn
          retention-days: 30
