name: Restore historical banner assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0

      - name: Guard integration branch
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "agent/main-unification"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore 17 historical PNG banners
        shell: bash
        run: |
          git fetch origin 60e74010ca3f3ff27827b24ebc338ae486a7739f --depth=1
          for number in $(seq -w 1 17); do
            git checkout FETCH_HEAD -- "images/${number}.png"
            test -s "images/${number}.png"
          done

      - name: Apply banner runtime and test fixes
        run: node scripts/fix-banner-runtime.mjs

      - name: Validate restored assets
        shell: bash
        run: |
          node --check app.js
          node --check scripts/browser-smoke.mjs
          for number in $(seq -w 1 17); do
            test -s "images/${number}.png"
          done
          ! grep -q 'images/${number}.webp' app.js
          grep -q "button.active')?.dataset.slide" scripts/browser-smoke.mjs

      - name: Commit integration-branch restoration
        shell: bash
        run: |
          git config user.name "daedong-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js scripts/browser-smoke.mjs images/01.png images/02.png images/03.png images/04.png images/05.png images/06.png images/07.png images/08.png images/09.png images/10.png images/11.png images/12.png images/13.png images/14.png images/15.png images/16.png images/17.png
          if git diff --cached --quiet; then
            echo "No banner restoration changes to commit"
            exit 0
          fi
          git commit -m "과거 배너 원본 복원과 무한슬라이드 검수 수정"
          git push origin HEAD:agent/main-unification
