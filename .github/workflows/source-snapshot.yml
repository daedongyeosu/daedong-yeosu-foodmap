name: Source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/main-unification
          fetch-depth: 0
          show-progress: false

      - name: Build source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-snapshot
          cp -a index.html app.css app.js /tmp/source-snapshot/
          cp -a scripts data .github /tmp/source-snapshot/
          cp -a payload-manifest.json SHA256SUMS.txt photo-batch2-integrity-result.json /tmp/source-snapshot/ 2>/dev/null || true
          git rev-parse HEAD > /tmp/source-snapshot/BRANCH_HEAD.txt
          git rev-parse origin/main > /tmp/source-snapshot/MAIN_HEAD.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: final-integration-source-snapshot
          path: /tmp/source-snapshot/**
          if-no-files-found: error
          retention-days: 7
