name: Four approved UX reinforcements

on:
  push:
    branches: [fix/restore-approved-ux]
    paths:
      - 'data/ux-four-upload/READY'
  pull_request:
    branches: [main]
    paths:
      - 'data/ux-four-upload/**'
      - '.github/workflows/ux-four-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-approved-ux
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify selective patch
        shell: bash
        run: |
          set -euo pipefail
          cd data/ux-four-upload
          echo '6e017564305f0a39ce4b3dc310d60d2c4cf3f45ea8d516174d1232c1f7c9944a  part-00.b64' | sha256sum -c -
          echo 'acef37cc46d9ba00e0639ea1bdc61a692385199d782124f7a78d05974d218225  part-01.b64' | sha256sum -c -
          echo 'fcb5a65c8b6c07114b2369049edb828e283e2d21a35eea90f6d95af21cb68cd2  part-02.b64' | sha256sum -c -
          cat part-00.b64 part-01.b64 part-02.b64 | base64 -d > /tmp/ux-four.patch.gz
          echo '17211862405ef23b4c5bf543ae86086062ecc8b82f0a574ee4b297da95de0135  /tmp/ux-four.patch.gz' | sha256sum -c -
          gunzip -c /tmp/ux-four.patch.gz > /tmp/ux-four.patch
          cd "$GITHUB_WORKSPACE"
          patch -p1 < /tmp/ux-four.patch
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/validate-static.mjs')
          text=path.read_text()
          old='check(app.includes("event.key === \'Escape\'")&&app.includes("event.target === $(\'#modal\')")&&app.includes("popstate"),\'X·바깥·ESC·뒤로가기 닫기 구현\');'
          new='check((app.includes("event.key === \'Escape\'")||app.includes("event.key !== \'Escape\'"))&&app.includes("event.target === $(\'#modal\')")&&app.includes("popstate")&&app.includes("hardClose"),\'X·바깥·ESC·뒤로가기 닫기 구현\');'
          if old not in text:
              raise SystemExit('static close check target not found')
          path.write_text(text.replace(old,new))
          PY
      - name: Validate preserved and reinforced behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check scripts/approved-ux-mobile.mjs
          node scripts/validate-static.mjs
          node scripts/test-app-unit.mjs
          node scripts/validate-data.mjs
          sha256sum -c SHA256SUMS.txt
          node scripts/validate-photo-batch2-vetted.mjs
          grep -q 'class InfiniteCarousel' app.js
          grep -q 'new InfiniteCarousel(carouselRoot,{interval:3500})' app.js
          grep -q 'function hardClose' app.js
          grep -q 'window.DaedongSelectedOrderApp' app.js
          grep -q 'function openPhotoViewer' app.js
          grep -q 'address-single-sheet' app.js
          grep -q 'aspect-ratio:5/4' app.css
      - name: Commit selective reinforcements only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- static-validation-report.json data-validation-report.json photo-batch2-integrity-result.json 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js app.css index.html scripts/approved-ux-mobile.mjs scripts/test-app-unit.mjs scripts/validate-static.mjs
          git commit -m '주소 단일팝업·hardClose·선택앱 호환·사진뷰어 보강'
          git push origin HEAD:fix/restore-approved-ux
