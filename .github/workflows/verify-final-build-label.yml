name: Verify final build label branch

on:
  push:
    branches: [agent/post-merge-pages-check]
    paths:
      - '.github/workflows/verify-final-build-label.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: agent/post-merge-pages-check
          fetch-depth: 0
          show-progress: false

      - name: Publish run ID
        shell: bash
        run: |
          set -euo pipefail
          cat > final-build-label-validation.json <<JSON
          {"status":"in_progress","runId":$GITHUB_RUN_ID,"runUrl":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID","candidateSha":"aad2263836da16f8aa659d643a5727c7f2ee2240"}
          JSON
          git config user.name 'daedong-label-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add final-build-label-validation.json
          git commit -m 'chore: expose build-label validation run'
          git push origin HEAD:agent/post-merge-pages-check

      - name: Checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach origin/fix/final-build-label
          test "$(git rev-parse HEAD)" = 'aad2263836da16f8aa659d643a5727c7f2ee2240'
          test "$(git diff --name-only origin/main...HEAD)" = 'index.html'
          test "$(git diff --numstat origin/main...HEAD)" = $'1\t1\tindex.html'
          grep -q '<div class="build-mark">대동여수음식지도 정식 통합본</div>' index.html
          ! grep -q '최종 통합 검증 후보 · main 미반영' index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unchanged-code checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/label-proof/logs
          node --check app.js 2>&1 | tee /tmp/label-proof/logs/01-app-syntax.log
          node scripts/test-app-unit.mjs 2>&1 | tee /tmp/label-proof/logs/02-unit.log
          node scripts/validate-data.mjs 2>&1 | tee /tmp/label-proof/logs/03-data.log
          sha256sum -c SHA256SUMS.txt 2>&1 | tee /tmp/label-proof/logs/04-sha256.log
          node scripts/validate-photo-batch2-vetted.mjs 2>&1 | tee /tmp/label-proof/logs/05-photo.log

      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock playwright@1.55.0 2>&1 | tee /tmp/label-proof/logs/06-playwright.log
          npx playwright install --with-deps chromium 2>&1 | tee /tmp/label-proof/logs/07-chromium.log

      - name: Run mobile validation and label assertion
        shell: bash
        run: |
          set -o pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/label-proof/logs/08-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          BASE_URL=http://127.0.0.1:4173 node scripts/browser-smoke.mjs 2>&1 | tee /tmp/label-proof/logs/09-mobile.log
          cp browser-smoke-report.json /tmp/label-proof/browser-smoke-report.json
          cp browser-mobile.png /tmp/label-proof/browser-mobile.png
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
          const text=(await page.locator('.build-mark').innerText()).trim();
          if(text!=='대동여수음식지도 정식 통합본') throw new Error(`Unexpected build mark: ${text}`);
          await page.locator('.build-mark').scrollIntoViewIfNeeded();
          await page.screenshot({path:'/tmp/label-proof/build-label-mobile.png',fullPage:true});
          fs.writeFileSync('/tmp/label-proof/build-label-check.json',JSON.stringify({success:true,text,oldTextPresent:(await page.content()).includes('최종 통합 검증 후보 · main 미반영')},null,2)+'\n');
          await browser.close();
          NODE

      - name: Build final validation result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const browser=JSON.parse(fs.readFileSync('/tmp/label-proof/browser-smoke-report.json','utf8'));
          const label=JSON.parse(fs.readFileSync('/tmp/label-proof/build-label-check.json','utf8'));
          const result={status:'success',success:Boolean(browser.success&&label.success&&!label.oldTextPresent),runId:Number(process.env.GITHUB_RUN_ID),runUrl:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,candidateSha:'aad2263836da16f8aa659d643a5727c7f2ee2240',changedFiles:['index.html'],diff:{additions:1,deletions:1},buildMark:label.text,mobile:{pass:browser.checks.length,warn:browser.warnings?.length||0,fail:browser.success?0:1},verifiedAt:new Date().toISOString()};
          if(!result.success)throw new Error('Build label validation failed');
          fs.writeFileSync('/tmp/label-proof/final-build-label-validation.json',JSON.stringify(result,null,2)+'\n');
          NODE

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-build-label-validation
          path: /tmp/label-proof/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish final result
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/label-proof/final-build-label-validation.json /tmp/final-result.json
          git fetch origin agent/post-merge-pages-check
          git switch -C agent/post-merge-pages-check origin/agent/post-merge-pages-check
          cp /tmp/final-result.json final-build-label-validation.json
          git config user.name 'daedong-label-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add final-build-label-validation.json
          git commit -m 'chore: record build-label validation success'
          git push origin HEAD:agent/post-merge-pages-check
