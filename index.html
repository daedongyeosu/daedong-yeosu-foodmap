  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    .banner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 220px;
      overflow: hidden;
      background: #111;
      isolation: isolate;
    }
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s ease;
      background: #111;
      overflow: hidden;
    }
    .slide::before {
      content: "";
      position: absolute;
      inset: -28px;
      z-index: 0;
      background-image: var(--bg);
      background-position: center;
      background-size: cover;
      filter: blur(22px) brightness(.38);
      transform: scale(1.08);
    }
    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(0,0,0,.12);
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }
    .slide a {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }
    .loader {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .nav {
      position: absolute;
      top: 50%;
      z-index: 20;
      transform: translateY(-50%);
      width: 42px;
      height: 58px;
      border: 0;
      border-radius: 9px;
      background: rgba(0,0,0,.42);
      color: #fff;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    .prev { left: 5px; }
    .next { right: 5px; }
    .counter {
      position: absolute;
      left: 50%;
      bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 20;
      transform: translateX(-50%);
      min-width: 54px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.48);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    @media (min-width: 900px) {
      .banner {
        max-width: 1200px;
        height: min(100vh, 700px);
        margin: 0 auto;
      }
      .nav { width: 40px; height: 56px; font-size: 30px; }
      .prev { left: 8px; }
      .next { right: 8px; }
      .dot { width: 8px; height: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide { transition: none; }
      .spinner { animation: none; }
    }
  </style>

    <button class="nav prev" type="button" aria-label="이전 광고">‹</button>

  <script>
    const slides = [...document.querySelectorAll(".slide")];
    const banner = document.getElementById("banner");
    const loader = document.getElementById("loader");
    const counter = document.getElementById("counter");
    const prevBtn = document.querySelector(".prev");
    const nextBtn = document.querySelector(".next");
    const delay = 4500;
    let current = 0;
    let timer = null;
    let startX = 0;

    slides.forEach((slide) => {
      slide.style.setProperty("--bg", `url("${slide.dataset.bg}")`);
    });

    function activateImage(index) {
      const img = slides[index].querySelector("img");
      if (!img.getAttribute("src") && img.dataset.src) {
        img.src = img.dataset.src;
        img.srcset = img.dataset.srcset;
      }
    }

    function preload(index) {
      const real = (index + slides.length) % slides.length;
      activateImage(real);
      const img = slides[real].querySelector("img");
      if (img.src) {
        const pre = new Image();
        pre.srcset = img.srcset || "";
        pre.sizes = "100vw";
        pre.src = img.src;
      }
    }

    function show(index) {
      slides[current].classList.remove("active");
      current = (index + slides.length) % slides.length;
      activateImage(current);
      slides[current].classList.add("active");
      counter.textContent = `${current + 1} / ${slides.length}`;
      preload(current + 1);
      preload(current + 2);
    }

    function next() { show(current + 1); }
    function prev() { show(current - 1); }
    function stop() {
      if (timer) clearInterval(timer);
      timer = null;
    }
    function start() {
      stop();
      timer = setInterval(next, delay);
    }
    function restart() { start(); }

    prevBtn.addEventListener("click", () => { prev(); restart(); });
    nextBtn.addEventListener("click", () => { next(); restart(); });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") { prev(); restart(); }
      if (event.key === "ArrowRight") { next(); restart(); }
    });

    banner.addEventListener("touchstart", e => {
      startX = e.changedTouches[0].clientX;
      stop();
    }, { passive: true });

    banner.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 45) dx < 0 ? next() : prev();
      start();
    }, { passive: true });

    const first = slides[0].querySelector("img");
    const ready = () => {
      loader.classList.add("hidden");
      preload(1);
      preload(2);
      start();
    };
    if (first.complete && first.naturalWidth) ready();
    else {
      first.addEventListener("load", ready, { once: true });
      first.addEventListener("error", ready, { once: true });
    }

    document.addEventListener("visibilitychange", () => {
      document.hidden ? stop() : start();
    });
  </script>
