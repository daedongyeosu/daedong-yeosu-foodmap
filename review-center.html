<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>대동여수음식지도 검수센터</title>
<style>
:root{--orange:#ff5a1f;--bg:#f4f6f8;--line:#e2e6eb;--muted:#69717d;--red:#c62828;--green:#087c4c;--blue:#2457a7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#171a20}.wrap{max-width:920px;margin:auto;padding:18px 14px 80px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}h1{font-size:26px;margin:0 0 6px}header p{margin:0;color:var(--muted);line-height:1.5}.refresh{border:0;border-radius:12px;background:var(--orange);color:#fff;font-weight:900;padding:12px 16px;white-space:nowrap}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.notice{background:#fff8f4;border:1px solid #ffd2c0;border-radius:16px;padding:14px;line-height:1.55;margin-bottom:14px}.section{background:#fff;border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}.section-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}.section-head h2{font-size:19px;margin:0}.count{background:#eef1f4;border-radius:999px;padding:4px 9px;font-size:12px}.list{padding:8px 12px 14px}.item{border-bottom:1px solid #edf0f3;padding:13px 2px}.item:last-child{border-bottom:0}.item strong{display:block;font-size:16px;margin-bottom:5px}.item p{margin:4px 0;color:#4f5865;line-height:1.5}.item small{display:block;color:var(--muted);line-height:1.45}.candidate{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.candidate button{border:1px solid #ffd0bd;background:#fff8f4;color:#9a3c17;border-radius:999px;padding:7px 10px;font-size:12px}.danger strong{color:var(--red)}.autofix strong{color:var(--green)}.source-missing strong{color:var(--blue)}.empty{color:var(--muted);text-align:center;padding:24px}.search{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 13px;margin:8px 0 3px;font-size:15px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:10}@media(max-width:650px){.summary{grid-template-columns:repeat(2,1fr)}header{display:block}.refresh{margin-top:10px;width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>대동여수음식지도 검수센터</h1><p>전체 가게를 다시 검수하지 않고, 시스템이 해결하지 못한 항목만 보여줍니다.</p></div><button class="refresh" onclick="location.reload()">최신 결과 불러오기</button></header>
<div class="notice"><b>처리 원칙</b><br>띄어쓰기·순서·지점명 위치 차이는 자동으로 해결합니다. <b>사진 원본 자체가 없는 가게</b>와 <b>노션에서 보이지 않는 가게</b>는 구분해서 표시합니다.</div>
<div id="summary" class="summary"></div>
<div id="autoFix" class="section"></div>
<div id="sourceMissing" class="section"></div>
<div id="notionInvisible" class="section"></div>
<div id="notionLinks" class="section"></div>
<div id="photoChoices" class="section"></div>
<div id="photoMissingStore" class="section"></div>
<div class="section"><div class="section-head"><h2>사진 없는 가게 전체</h2><span id="noPhotoCount" class="count">0</span></div><div class="list"><input id="storeSearch" class="search" placeholder="가게명 검색"><div id="noPhotoList"></div></div></div>
</div>
<div id="toast" class="toast"></div>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=async url=>{try{const response=await fetch(`${url}?t=${Date.now()}`);return response.ok?await response.json():{};}catch{return{}}};
const section=(title,items,render,cls='')=>`<div class="section-head"><h2>${title}</h2><span class="count">${items.length}</span></div><div class="list ${cls}">${items.length?items.map(render).join(''):'<div class="empty">확인할 항목이 없습니다.</div>'}</div>`;
function toast(text){const node=document.querySelector('#toast');node.textContent=text;node.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.style.display='none',2300)}
async function copyMapping(folder,store){const text=`"${folder.replaceAll('"','\\"')}": "${store.replaceAll('"','\\"')}"`;try{await navigator.clipboard.writeText(text);toast('연결 문구를 복사했습니다. 채팅으로 보내면 다음부터 기억합니다.')}catch{toast(text)}}
(async()=>{
 const [photo,notion,coverage]=await Promise.all([read('data/photo-match-action-report.json'),read('data/notion-import-missing-report.json'),read('data/photo-coverage-resolution.json')]);
 const summary=coverage.summary||photo.summary||{};
 document.querySelector('#summary').innerHTML=[['전체 가게',summary.totalStores||summary.stores||0],['사진 연결',summary.storesWithPhotos||0],['원본 사진 없음',summary.sourceMissing||0],['노션 가게 없음',summary.photoFolderWithoutNotionStore||0]].map(([label,value])=>`<div class="stat"><b>${esc(value)}</b><span>${esc(label)}</span></div>`).join('');
 const auto=Array.isArray(coverage.likelyAutoFix)?coverage.likelyAutoFix:[];
 document.querySelector('#autoFix').innerHTML=section('규칙 보강으로 자동연결 가능한 후보',auto,item=>`<div class="item autofix"><strong>${esc(item.store)}</strong><p>후보 사진 폴더: ${esc(item.candidate)} · ${esc(item.score)}점</p><small>다음 사진 작업에서 자동 연결 규칙을 보강할 대상입니다.</small></div>`);
 const missing=Array.isArray(coverage.sourceMissing)?coverage.sourceMissing:[];
 document.querySelector('#sourceMissing').innerHTML=section('업로드된 원본 사진 자체가 없는 가게',missing,item=>`<div class="item source-missing"><strong>${esc(item.store)}</strong><p>${esc(item.reason)}</p><small>이 항목은 알고리즘으로 만들 수 없습니다. 안전한 음식사진을 추가하거나 ‘사진 준비 중’을 유지해야 합니다.</small></div>`);
 const targets=Array.isArray(notion.targetDiagnostics)?notion.targetDiagnostics:[];
 const invisible=targets.filter(item=>item.visibleToIntegration===false);
 document.querySelector('#notionInvisible').innerHTML=section('노션 연결 또는 위치 확인 필요',invisible,item=>`<div class="item danger"><strong>${esc(item.keyword)}</strong><p>노션 연동 프로그램에서 이 가게 페이지가 보이지 않습니다.</p><small>가게 페이지의 연결에 ‘대동여수음식지도’를 추가하거나, 연결된 상위 페이지 아래로 옮겨 주세요.</small></div>`);
 const diagnostics=Array.isArray(notion.pageDiagnostics)?notion.pageDiagnostics:[];
 const noLinks=diagnostics.filter(item=>item.result==='skipped'&&String(item.reason||'').includes('주문 링크 없음'));
 document.querySelector('#notionLinks').innerHTML=section('노션 주문링크 보강 필요',noLinks,item=>`<div class="item"><strong>${esc(item.title)}</strong><p>${esc(item.reason)}</p><small>가게 페이지에 실제 주문 링크 하나 이상을 추가하세요.</small></div>`);
 const choices=Array.isArray(photo.photoChoiceActions)?photo.photoChoiceActions:[];
 document.querySelector('#photoChoices').innerHTML=section('사진 후보 선택 필요',choices,item=>`<div class="item"><strong>사진 폴더: ${esc(item.folderName)}</strong><p>${esc(item.instruction)}</p><div class="candidate">${(item.candidates||[]).map(candidate=>`<button onclick='copyMapping(${JSON.stringify(item.folderName)},${JSON.stringify(candidate.store)})'>${esc(candidate.store)} · ${esc(candidate.score)}점</button>`).join('')}</div></div>`);
 const notionActions=Array.isArray(photo.notionActions)?photo.notionActions:[];
 document.querySelector('#photoMissingStore').innerHTML=section('사진 폴더는 있지만 연결할 노션 가게가 없음',notionActions,item=>`<div class="item danger"><strong>${esc(item.folderName)}</strong><p>${esc(item.instruction)}</p></div>`);
 const stores=Array.isArray(photo.storesWithoutPhotos)?photo.storesWithoutPhotos:[];
 const list=document.querySelector('#noPhotoList');
 const draw=query=>{const filtered=stores.filter(name=>String(name).toLowerCase().includes(query.toLowerCase())).slice(0,250);list.innerHTML=filtered.length?filtered.map(name=>`<div class="item"><strong>${esc(name)}</strong><small>현재 안전하게 연결된 음식사진이 없습니다.</small></div>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>'};
 document.querySelector('#noPhotoCount').textContent=stores.length;
 document.querySelector('#storeSearch').addEventListener('input',event=>draw(event.target.value));
 draw('');
})();
</script>
</body>
</html>
